<script>
    // 1. Supabase Connect Karein
    const SUPABASE_URL = 'https://efgvsdclcnbmwqbtily.supabase.co';

    const supabase = lib.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function finalStep() {

        const savedData = JSON.parse(localStorage.getItem('temp_order'));

        if (savedData) {

            } else {
                document.getElementById('msg').innerHTML = "Data save karne mein error aaya, kripya screenshot bhejien.";
                console.log(error);
            }
        } else {
            document.getElementById('msg').innerHTML = "Koi purana data nahi mila.";
        }
    }

    finalStep();
