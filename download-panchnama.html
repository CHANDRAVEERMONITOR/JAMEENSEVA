<!DOCTYPE html>
<html lang="hi">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3881463813155829"
<meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Panchnama - JameenSeva</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px; background: #f4f7f6; color: #333; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        .success-icon { font-size: 50px; color: #27ae60; margin-bottom: 10px; }
        .btn { display: inline-block; background: #27ae60; color: white; padding: 15px 25px; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 20px; box-shadow: 0 4px 10px rgba(39,174,96,0.3); }
        #timer { color: #e67e22; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div class="success-icon">✔</div>
        <h2 style="margin: 0;">Payment Success!</h2>
        <p>Aapka Panchnama format taiyar hai.</p>
        
        <div id="loading-area">
            <p>File <span id="timer">5</span> second mein download hogi...</p>
        </div>

        <a href="https://drive.google.com/uc?export=download&id=1FyHSFb83X0h21RsoOLnNEFsfZpvPDw1r" id="downloadLink" class="btn" style="display: none;">⬇️ Click to Download PDF</a>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
        <p style="font-size: 0.8em; color: #666;">Dhyan dein: Agar download shuru nahi hota, toh upar diye gaye button par click karein.</p>
    </div>

    <script>
    // Security Check: Kya user Razorpay se aaya hai?
    // Note: 'api.razorpay.com' ya 'checkout.razorpay.com' check karega
    var legalReferrer = document.referrer;
    
    if (legalReferrer.indexOf("razorpay.com") === -1 && legalReferrer.indexOf("jameenseva.in") === -1) {
        // Agar koi direct link khole toh use Home Page par bhej do
        alert("Security Alert: Direct access block hai. Kripya payment karke download karein.");
        window.location.href = "https://jameenseva.in/panchnama-batwara-download.html";
    } else {
        // Agar payment se aaya hai toh download chalu karo
        let count = 5;
        let timer = document.getElementById('timer');
        let btn = document.getElementById('downloadLink');

        let countdown = setInterval(function() {
            count--;
            timer.innerText = count;
            if (count <= 0) {
                clearInterval(countdown);
                document.getElementById('loading-area').style.display = 'none';
                btn.style.display = 'inline-block';
                // Auto Download
                window.location.href = btn.href;
            }
        }, 1000);
    }
</script>

</body>
</html>
