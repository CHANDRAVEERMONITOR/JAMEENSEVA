<header class="hero-container">
  <h1>बिहार केवाला (सत्यापित नकल / वेब कॉपी) ऑर्डर करें</h1>
  <p>जिला, रजिस्ट्री ऑफिस एवं अंचल चुनकर अपनी ज़मीन का केवाला आसानी से मंगवाएं।</p>
</header>

<div class="container">
  <div class="form-card">
    <form id="kevalaForm" onsubmit="handleOrder(event)">
      
      <!-- Step 1: Document Type -->
      <div class="section-title">📄 1. केवाला दस्तावेज़ का प्रकार चुनें</div>
      <div class="radio-grid">
        <label class="radio-card active" id="type-cert" onclick="selectDocType('Certified Copy')">
          <input type="radio" name="doc_type" value="Certified Copy" checked /> 📜 Certified Copy (प्रमाणित नकल)
        </label>
        <label class="radio-card" id="type-web" onclick="selectDocType('Web Copy')">
          <input type="radio" name="doc_type" value="Web Copy" /> 💻 Web Copy (डिजिटल कॉपी)
        </label>
      </div>

      <!-- Step 2: Location & Registry Office Dropdowns -->
      <div class="section-title">📍 2. रजिस्ट्री ऑफिस एवं अंचल विवरण</div>
      <div class="form-grid">
        
        <div class="form-group">
          <label>1. जिला (District) *</label>
          <select id="district" onchange="onDistrictChange()" required>
            <option value="">-- जिला चुनें --</option>
            <!-- Dropdown Options Populated Dynamically -->
          </select>
        </div>

        <div class="form-group">
          <label>2. रजिस्ट्री ऑफिस (Registry Office) *</label>
          <select id="registry_office" required disabled>
            <option value="">-- पहले जिला चुनें --</option>
          </select>
        </div>

        <div class="form-group">
          <label>3. अंचल / सर्किल / ब्लॉक (Anchal) *</label>
          <select id="anchal_circle" required disabled>
            <option value="">-- पहले जिला चुनें --</option>
          </select>
        </div>

        <div class="form-group">
          <label>4. मौजा का नाम (Mauza Name) *</label>
          <input type="text" id="mauza_name" placeholder="ग्राम / मौजा का नाम लिखें" required />
        </div>

        <div class="form-group full-width">
          <label>5. थाना नंबर (Thana No.)</label>
          <input type="text" id="thana_number" placeholder="थाना नंबर (यदि ज्ञात हो)" />
        </div>

      </div>

      <!-- Step 3: Date & Details -->
      <div class="section-title">🔍 3. खोज समय-सीमा एवं ज़मीन विवरण</div>
      <div class="form-grid">
        <div class="form-group">
          <label>कब से (From Date) *</label>
          <input type="date" id="date_from" required />
        </div>
        <div class="form-group">
          <label>कब तक (To Date) *</label>
          <input type="date" id="date_to" required />
        </div>
        <div class="form-group">
          <label>बेचने वाले का नाम (Seller Name)</label>
          <input type="text" id="seller_name" placeholder="दाता का नाम" />
        </div>
        <div class="form-group">
          <label>खरीदने वाले का नाम (Buyer Name)</label>
          <input type="text" id="buyer_name" placeholder="गृहीता का नाम" />
        </div>
        <div class="form-group">
          <label>खाता नंबर (Khata No.)</label>
          <input type="text" id="khata_number" placeholder="खाता संख्या" />
        </div>
        <div class="form-group">
          <label>प्लॉट / खेसरा नंबर (Plot No.)</label>
          <input type="text" id="plot_number" placeholder="खेसरा संख्या" />
        </div>
        <div class="form-group full-width">
          <label>दस्तावेज़ / डीड संख्या (Deed No. - यदि उपलब्ध हो)</label>
          <input type="text" id="deed_number" placeholder="Deed / Registry Number" />
        </div>
      </div>

      <!-- Step 4: Personal Info -->
      <div class="section-title">👤 4. आवेदक एवं डिलीवरी विवरण</div>
      <div class="form-grid">
        <div class="form-group">
          <label>आपका नाम (Full Name) *</label>
          <input type="text" id="customer_name" placeholder="अपना पूरा नाम लिखें" required />
        </div>
        <div class="form-group">
          <label>मोबाइल नंबर (Mobile No.) *</label>
          <input type="tel" id="customer_mobile" maxlength="10" placeholder="10-अंकों का नंबर" required />
        </div>
        <div class="form-group full-width">
          <label>पूरा पता (Full Delivery Address) *</label>
          <textarea id="full_address" rows="2" placeholder="मकान नं, गाँव/शहर, पोस्ट" required></textarea>
        </div>
        <div class="form-group">
          <label>पिन कोड (Pincode) *</label>
          <input type="text" id="pincode" maxlength="6" placeholder="6-अंकों का पिन कोड" required />
        </div>
        <div class="form-group">
          <label>भुगतान विधि (Payment Method)</label>
          <select id="payment_method">
            <option value="COD">🚚 Cash On Delivery (COD)</option>
            <option value="Online">💳 Online Payment</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">ऑर्डर सबमिट करें (Submit Request)</button>
    </form>

    <div id="status-msg"></div>
  </div>
</div>

  // Populate District Dropdown on Load
  window.addEventListener('DOMContentLoaded', () => {
    const distSelect = document.getElementById('district');
    Object.keys(districtMasterData).forEach(dist => {
      const opt = document.createElement('option');
      opt.value = dist;
      opt.textContent = dist;
      distSelect.appendChild(opt);
    });
  });

  // Dynamic Trigger when District is Selected
  function onDistrictChange() {
    const dist = document.getElementById('district').value;
    const regSelect = document.getElementById('registry_office');
    const anchalSelect = document.getElementById('anchal_circle');

    regSelect.innerHTML = '';
    anchalSelect.innerHTML = '';

    if (!dist || !districtMasterData[dist]) {
      regSelect.disabled = true;
      anchalSelect.disabled = true;
      regSelect.innerHTML = '<option value="">-- पहले जिला चुनें --</option>';
      anchalSelect.innerHTML = '<option value="">-- पहले जिला चुनें --</option>';
      return;
    }

    // Enable Selects
    regSelect.disabled = false;
    anchalSelect.disabled = false;

    // Populate Registry Offices
    regSelect.innerHTML = '<option value="">-- रजिस्ट्री ऑफिस चुनें --</option>';
    const offices = districtMasterData[dist].offices || ["सदर"];
    offices.forEach(office => {
      const opt = document.createElement('option');
      opt.value = office;
      opt.textContent = office;
      regSelect.appendChild(opt);
    });

    // Populate Anchals
    anchalSelect.innerHTML = '<option value="">-- अंचल / ब्लॉक चुनें --</option>';
    const anchals = districtMasterData[dist].anchals || [];
    anchals.forEach(anchal => {
      const opt = document.createElement('option');
      opt.value = anchal;
      opt.textContent = anchal;
      anchalSelect.appendChild(opt);
    });
  }

  let selectedDocType = 'Certified Copy';

  function selectDocType(type) {
    selectedDocType = type;
    document.getElementById('type-cert').classList.toggle('active', type === 'Certified Copy');
    document.getElementById('type-web').classList.toggle('active', type === 'Web Copy');
  }

  // Handle Form Submission to Supabase
  async function handleOrder(event) {
    event.preventDefault();

    const btn = document.getElementById('submit-btn');
    const msg = document.getElementById('status-msg');

    const orderId = `JS-KV-${Math.floor(100000 + Math.random() * 900000)}`;

    const formData = {
      order_id: orderId,
      document_type: selectedDocType,
      district: document.getElementById('district').value,
      registry_office: document.getElementById('registry_office').value,
      anchal_circle: document.getElementById('anchal_circle').value,
      mauza_name: document.getElementById('mauza_name').value.trim(),
      thana_number: document.getElementById('thana_number').value.trim(),
      date_from: document.getElementById('date_from').value,
      date_to: document.getElementById('date_to').value,
      seller_name: document.getElementById('seller_name').value.trim(),
      buyer_name: document.getElementById('buyer_name').value.trim(),
      khata_number: document.getElementById('khata_number').value.trim(),
      plot_number: document.getElementById('plot_number').value.trim(),
      deed_number: document.getElementById('deed_number').value.trim(),
      customer_name: document.getElementById('customer_name').value.trim(),
      customer_mobile: document.getElementById('customer_mobile').value.trim(),
      full_address: document.getElementById('full_address').value.trim(),
      pincode: document.getElementById('pincode').value.trim(),
      payment_method: document.getElementById('payment_method').value
    };

    if (!/^\d{10}$/.test(formData.customer_mobile)) {
      alert('कृपया 10-अंकों का सही मोबाइल नंबर दर्ज करें।'); return;
    }
    if (!/^\d{6}$/.test(formData.pincode)) {
      alert('कृपया 6-अंकों का सही पिन कोड दर्ज करें।'); return;
    }

    btn.disabled = true;
    btn.textContent = '⏳ प्रोसेस हो रहा है...';

    try {
      const { data, error } = await _supabase
        .from('kevala_orders')
        .insert([formData]);

      if (error) throw error;

      msg.style.display = 'block';
      msg.style.background = '#e6fffa';
      msg.style.color = '#234e52';
      msg.style.border = '1px solid #b2f5ea';
      msg.innerHTML = `✅ <strong>आपका केवाला ऑर्डर सबमिट हो गया है!</strong><br><br>
                       📌 <strong>Order ID:</strong> ${orderId}<br>
                       हमारी टीम जल्द ही आपसे WhatsApp पर संपर्क करेगी।`;
      
      document.getElementById('kevalaForm').reset();
      document.getElementById('registry_office').disabled = true;
      document.getElementById('anchal_circle').disabled = true;
      btn.style.display = 'none';

    } catch (err) {
      console.error('Supabase Error:', err);
      msg.style.display = 'block';
      msg.style.background = '#fff5f5';
      msg.style.color = '#9b2c2c';
      msg.style.border = '1px solid #feb2b2';
      msg.innerHTML = '❌ सबमिट करने में समस्या आई। कृपया पुनः प्रयास करें।';
      btn.disabled = false;
      btn.textContent = 'ऑर्डर सबमिट करें (Submit Request)';
    }
  }
