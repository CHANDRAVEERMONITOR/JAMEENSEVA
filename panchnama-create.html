<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari&display=swap" rel="stylesheet">

<style>

body { font-family: 'Noto Sans Devanagari'; }

.page {
  width: 794px;
  height: 1123px;
  margin: auto;
  position: relative;
  page-break-after: always;
}

.stamp { height: 480px; }

table {
  width: 100%;
  border-collapse: collapse;
}

td, th {
  border: 1px solid black;
  font-size: 13px;
  padding: 3px;
}

.footer {
  position: absolute;
  bottom: 20px;
  width: 100%;
}

.left { float:left; }
.right { float:right; }
.center { text-align:center; }

</style>
</head>

<body>

<h2>📝 Form</h2>

<div id="hissedaar"></div>
<button onclick="addH()">➕ Hissedaar</button>

<h3>भूमि विवरण</h3>
<div id="land"></div>
<button onclick="addLand()">➕ Land</button>

<br><br>
<button onclick="generate()">📄 Generate PDF</button>

<hr>

<div id="output"></div>

<script>

// ➕ Hissedaar
function addH(){
  let d = document.createElement("div");
  d.innerHTML = `
  नाम <input class="name">
  पिता <input class="father">
  जाति <input class="jati">
  उम्र <input class="age">
  आधार <input class="aadhar">
  गांव <input class="village">
  पंचायत <input class="panchayat">
  अंचल <input class="anchal">
  जिला <input class="district">
  रजिस्ट्री ऑफिस <input class="reg">
  <br><br>`;
  hissedaar.appendChild(d);
}

// ➕ Land
function addLand(){
  let d = document.createElement("div");
  d.innerHTML = `
  Mauja <input class="mauja">
  Thana <input class="thana">
  Khata <input class="khata">
  Khesra <input class="khesra">
  Rakwa <input class="rakwa">
  <br>`;
  land.appendChild(d);
}

// 🚀 Generate
function generate(){

  let html = "";

  // PAGE 1
  html += `<div class="page">
  <div class="stamp"></div>
  <h3 style="text-align:center;">सहमति पंचनामा बटवारा</h3>`;

  // Hissedaar list
  let names = document.querySelectorAll(".name");

  names.forEach((n,i)=>{
    html += `<p>
    फरिक नं ${i+1} - ${n.value},
    पिता: ${document.querySelectorAll(".father")[i].value},
    जाति: ${document.querySelectorAll(".jati")[i].value},
    उम्र: ${document.querySelectorAll(".age")[i].value},
    आधार: ${document.querySelectorAll(".aadhar")[i].value},
    ग्राम: ${document.querySelectorAll(".village")[i].value},
    पंचायत: ${document.querySelectorAll(".panchayat")[i].value},
    अंचल: ${document.querySelectorAll(".anchal")[i].value},
    जिला: ${document.querySelectorAll(".district")[i].value},
    रजिस्ट्री: ${document.querySelectorAll(".reg")[i].value}
    </p>`;
  });

  html += footer(1);
  html += `</div>`;

  // PAGE 2 (Land)
  html += `<div class="page">
  <h3>भूमि विवरण</h3>
  <table>
  <tr><th>Mauja</th><th>Thana</th><th>Khata</th><th>Khesra</th><th>Rakwa</th></tr>`;

  let total = 0;

  document.querySelectorAll(".mauja").forEach((m,i)=>{
    let r = parseFloat(document.querySelectorAll(".rakwa")[i].value || 0);
    total += r;

    html += `<tr>
    <td>${m.value}</td>
    <td>${document.querySelectorAll(".thana")[i].value}</td>
    <td>${document.querySelectorAll(".khata")[i].value}</td>
    <td>${document.querySelectorAll(".khesra")[i].value}</td>
    <td>${r}</td>
    </tr>`;
  });

  html += `</table>
  <p>कुल रकवा (decimal): ${total}</p>`;

  html += footer(2);
  html += `</div>`;

  output.innerHTML = html;

  window.print();
}

// footer
function footer(page){
  return `
  <div class="footer">
    <div class="left">सरपंच हस्ताक्षर</div>
    <div class="center">Page ${page}</div>
    <div class="right">गवाह / हिस्सेदार हस्ताक्षर</div>
  </div>`;
}

</script>

</body>
</html>
