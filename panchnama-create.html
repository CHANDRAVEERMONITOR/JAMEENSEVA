<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>सहमति पंचनामा बटवारा - Jameenseva.in</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --primary: #1a237e;
            --secondary: #0d47a1;
            --success: #1b5e20;
            --danger: #b71c1c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #e0eafc, #cfdef3); 
            padding: 20px; 
        }

        .container { max-width: 1200px; margin: auto; }

        /* Dashboard UI - सिर्फ स्क्रीन के लिए */
        .form-section { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 35px; 
            margin-bottom: 30px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        h2 { text-align: center; color: var(--primary); margin-bottom: 30px; font-size: 28px; font-weight: 600; }
        h3 { background: #e3f2fd; padding: 10px 20px; border-radius: 10px; margin: 25px 0 15px 0; color: var(--secondary); font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
        .input-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 15px; }
        .input-group label { font-weight: 600; margin-bottom: 8px; font-size: 14px; color: #555; display: block; }
        input, textarea, select { width: 100%; padding: 12px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 14px; font-family: 'Poppins', sans-serif; }
        input:focus { border-color: var(--secondary); outline: none; box-shadow: 0 0 0 3px rgba(13, 71, 161, 0.1); }
        .btn { padding: 12px 25px; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-blue { background: var(--secondary); color: white; }
        .btn-green { background: var(--success); color: white; }
        .btn-red { background: var(--danger); color: white; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        table { width: 100%; border-collapse: separate; border-spacing: 0; margin: 15px 0; border-radius: 10px; overflow: hidden; border: 1px solid #ddd; }
        th { background: #f8f9fa; padding: 12px; font-size: 14px; }
        td { padding: 10px; border-top: 1px solid #eee; }
        .farik-box { border-left: 5px solid var(--secondary); background: #fff; padding: 20px; margin-bottom: 25px; border-radius: 0 15px 15px 0; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .hidden { display: none; }

        /* ===== PDF / प्रिंट स्टाइल - सरकारी फॉर्मेट ===== */
        #printArea { 
            font-family: 'Noto Serif Devanagari', serif; 
            font-size: 14px; 
            line-height: 1.8; 
            color: #000;
        }
        .page { 
            background: white;
            width: 210mm;
            min-height: 297mm;
            padding: 20mm;
            margin: 10px auto;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            page-break-after: always;
        }
        .page:last-child { page-break-after: avoid; }
        .page h3 { background: none; padding: 0; border: none; text-align: center; text-decoration: underline; margin: 15px 0; font-size: 16px; }
        .page table, .page th, .page td { border: 1px solid #000; font-size: 14px; }
        .page table { border-collapse: collapse; }
        .page th, .page td { padding: 6px 8px; }
        
        .stamp-box { 
            position: absolute; top: 15mm; right: 15mm; 
            width: 40mm; height: 40mm; 
            border: 2px solid #000; 
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; text-align: center; font-weight: 700;
        }
        .page-no { text-align: center; font-size: 12px; margin-bottom: 15px; }
        .vertical-text { writing-mode: vertical-rl; position: absolute; font-weight: 700; font-size: 14px; color: #000; }
        .v-sarpanch { left: 8mm; top: 35%; }
        .v-gawah { right: 8mm; top: 35%; }
        .v-fariken { right: 8mm; top: 70%; }
        .sign-area { display: flex; justify-content: space-between; margin-top: 100px; font-weight: 700; }
        .sign-area div { text-align: center; width: 30%; }
        
        /* वंशावली Tree */
        .tree { text-align: center; overflow-x: auto; }
        .tree ul { padding-top: 20px; position: relative; display: flex; justify-content: center; }
        .tree li { list-style-type: none; position: relative; padding: 20px 5px 0 5px; }
        .tree li::before, .tree li::after { content: ''; position: absolute; top: 0; right: 50%; border-top: 1.5px solid #000; width: 50%; height: 20px; }
        .tree li::after { right: auto; left: 50%; border-left: 1.5px solid #000; }
        .tree li:only-child::after, .tree li:only-child::before { display: none; }
        .tree li:only-child { padding-top: 0; }
        .tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
        .tree li:last-child::before { border-right: 1.5px solid #000; border-radius: 0 5px 0 0; }
        .tree li:first-child::after { border-radius: 5px 0 0 0; }
        .tree ul ul::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 1.5px solid #000; width: 0; height: 20px; }
        .tree li div { border: 1.5px solid #000; padding: 8px 12px; border-radius: 5px; font-weight: 700; background: #fff; min-width: 120px; display: inline-block; }

        @media print {
            body { background: none; padding: 0; }
            .no-print { display: none !important; }
            .page { box-shadow: none; margin: 0; border: none; width: 100%; min-height: auto; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="form-section no-print" id="inputFormBox">
        <h2><i class="fas fa-file-signature"></i> सहमति पंचनामा बटवारा</h2>
        <form id="batwaraForm">
            
            <h3><i class="fas fa-info-circle"></i> 1. मूल विवरण</h3>
            <div class="input-row">
                <div class="input-group"><label>न्यायालय:</label><input type="text" id="nyayalay" value="सरपंच ग्राम कचहरी"></div>
                <div class="input-group"><label>पंचायत:</label><input type="text" id="panchayat" placeholder="जैसे: भवानीपुर"></div>
                <div class="input-group"><label>अंचल:</label><input type="text" id="anchal" placeholder="जैसे: सिंहवाड़ा"></div>
                <div class="input-group"><label>जिला:</label><input type="text" id="jila" placeholder="जैसे: दरभंगा"></div>
                <div class="input-group"><label>वाद सं०:</label><input type="text" id="vadNo" placeholder="जैसे: 05/2026"></div>
                <div class="input-group"><label>दिनांक:</label><input type="date" id="dinank"></div>
            </div>

            <h3>
                <span><i class="fas fa-users"></i> 2. लेख्यकारी / फरीक</span>
                <button type="button" class="btn btn-blue" onclick="addFariken()"><i class="fas fa-user-plus"></i> फरीक जोड़ें</button>
            </h3>
            <div id="farikenContainer"></div>

            <h3><i class="fas fa-gavel"></i> 3. लेख्यप्रकार व मूल्य</h3>
            <div class="input-row">
                <div class="input-group"><label>लेख्यप्रकार:</label><input type="text" id="lekhyaPrakar" value="आपसी सहमति पंचनामा बटवारा"></div>
                <div class="input-group"><label>लेख्यमूल्य:</label><input type="text" id="lekhyaMulya" value="शून्य (आपसी पारिवारिक बंटवारा)"></div>
                <div class="input-group"><label>सम्पत्ति भूमि:</label><input type="text" id="sampatiBhumi" value="पैत्रिक जमीन जाइदाद"></div>
            </div>

            <h3>
                <span><i class="fas fa-map-marked-alt"></i> 4. कुल पैत्रिक भूमि विवरण</span>
                <button type="button" class="btn btn-blue" onclick="addBhumi('bhumiTbody')"><i class="fas fa-plus"></i> जमीन जोड़ें</button>
            </h3>
            <table>
                <thead><tr><th>मौजा</th><th>थाना नंo</th><th>खाता नंo</th><th>खेसरा नंo</th><th>रकवा (डि०)</th><th>रकवा (क०-धु०)</th><th class="no-print">X</th></tr></thead>
                <tbody id="bhumiTbody"></tbody>
                <tfoot><tr style="background: #f1f5f9; font-weight: bold;"><td colspan="4">कुल पैत्रिक भूमि रकवा (डिसमील) =</td><td id="totalRakwa" colspan="3">0.000</td></tr></tfoot>
            </table>

            <h3><i class="fas fa-sitemap"></i> 5. वंशावली (Vanshawali)</h3>
            <div class="farik-box">
                <div class="input-row">
                    <div class="input-group"><label>मूल पूर्वज का नाम:</label><input type="text" id="v_purvaj" placeholder="जैसे: स्व० मौजे साह"></div>
                    <div class="input-group"><label>पिता का नाम:</label><input type="text" id="v_purvaj_pita" placeholder="जैसे: स्व० बच्चे लाल साह"></div>
                </div>
                <div id="vanshavaliChild"></div>
                <button type="button" class="btn btn-blue" style="margin-top:10px;" onclick="addVanshNode('vanshavaliChild')"><i class="fas fa-child"></i> संतान जोड़ें</button>
            </div>

            <div style="text-align: center; margin-top: 40px;">
                <button type="button" class="btn btn-green" style="padding: 15px 40px; font-size: 18px;" onclick="generatePreview()">
                    <i class="fas fa-eye"></i> प्रिव्यू देखें
                </button>
            </div>
        </form>
    </div>

    <div class="form-section hidden" id="previewSection">
        <div class="no-print" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2><i class="fas fa-file-pdf"></i> दस्तावेज़ प्रिव्यू</h2>
            <div>
                <button class="btn btn-green" onclick="window.print()"><i class="fas fa-print"></i> प्रिंट</button>
                <button class="btn btn-red" onclick="downloadPDF()"><i class="fas fa-download"></i> PDF डाउनलोड</button>
                <button class="btn btn-blue" onclick="editForm()"><i class="fas fa-edit"></i> एडिट</button>
            </div>
        <div id="printArea"></div>
    </div>
</div>

<script>
    let farikCount = 0;

    function addFariken() {
        farikCount++;
        const html = `
        <div class="farik-box" id="farik_${farikCount}">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <strong style="color:var(--primary)">फरीक नंo-${farikCount} विवरण</strong>
                <button type="button" class="btn btn-red" style="padding:5px 10px; font-size:12px;" onclick="removeEl('farik_${farikCount}')"><i class="fas fa-trash"></i></button>
            </div>
            <div class="input-row">
                <div class="input-group"><label>नाम:</label><input type="text" class="f_name" required></div>
                <div class="input-group"><label>पिता/पति:</label><input type="text" class="f_pita" required></div>
                <div class="input-group"><label>उम्र:</label><input type="number" class="f_umar"></div>
                <div class="input-group"><label>आधार:</label><input type="text" class="f_aadhar" placeholder="[Aadhaar Redacted]"></div>
                <div class="input-group"><label>जाति:</label><input type="text" class="f_jati"></div>
                <div class="input-group"><label>ग्राम:</label><input type="text" class="f_gram"></div>
            </div>
            <h4 style="margin:15px 0 10px 0; font-size:14px; color:var(--secondary)">हिस्सा भूमि विवरण <button type="button" class="btn btn-blue" style="padding:2px 8px; font-size:11px;" onclick="addBhumi('farik_bhumi_${farikCount}')">+ जोड़ें</button></h4>
            <table>
                <thead><tr style="font-size:12px;"><th>खेसरा</th><th>रकवा(डि०)</th><th>रकवा(क०-धु०)</th><th>चौहद्दी</th><th class="no-print">X</th></tr></thead>
                <tbody id="farik_bhumi_${farikCount}"></tbody>
                <tfoot><tr><td>कुल हिस्सा (डि०):</td><td class="farik_total" style="font-weight:bold">0.000</td><td colspan="3"></td></tr></tfoot>
            </table>
        </div>`;
        document.getElementById('farikenContainer').insertAdjacentHTML('beforeend', html);
        addBhumi(`farik_bhumi_${farikCount}`);
    }

    function addBhumi(tbodyId) {
        const tr = document.createElement('tr');
        const uniqueId = Date.now() + Math.random();
        tr.id = `bhumi_${uniqueId}`;
        let isMain = (tbodyId === 'bhumiTbody');
        tr.innerHTML = `
            ${isMain ? '<td><input type="text" class="b_mauja"></td>' : ''}
            ${isMain ? '<td><input type="text" class="b_thana"></td>' : ''}
            ${isMain ? '<td><input type="text" class="b_khata"></td>' : ''}
            <td><input type="text" class="b_khesra"></td>
            <td><input type="number" step="0.001" class="b_rakwa_dis" oninput="calcTotal('${tbodyId}')"></td>
            <td><input type="text" class="b_rakwa_kd"></td>
            ${!isMain ? '<td><textarea class="b_chauhaddi" rows="1" placeholder="उ,द,पू,प"></textarea></td>' : ''}
            <td class="no-print"><button type="button" class="btn btn-red" style="padding:5px;" onclick="removeBhumi('${uniqueId}', '${tbodyId}')">X</button></td>
        `;
        document.getElementById(tbodyId).appendChild(tr);
    }

    function removeBhumi(rowId, tbodyId) {
        document.getElementById(`bhumi_${rowId}`).remove();
        calcTotal(tbodyId);
    }

    function removeEl(id) { document.getElementById(id).remove(); }

    function calcTotal(tbodyId) {
        let total = 0;
        document.querySelectorAll(`#${tbodyId} .b_rakwa_dis`).forEach(input => {
            total += parseFloat(input.value) || 0;
        });
        if (tbodyId === 'bhumiTbody') {
            document.getElementById('totalRakwa').innerText = total.toFixed(3);
        } else {
            document.querySelector(`#${tbodyId}`).closest('table').querySelector('.farik_total').innerText = total.toFixed(3);
        }
    }

    function addVanshNode(parentId) {
        const parent = document.getElementById(parentId);
        const div = document.createElement('div');
        const nodeId = 'vansh_' + Date.now();
        div.id = nodeId;
        div.style.cssText = 'border-left:2px dashed #ccc; padding-left:20px; margin:10px 0;';
        div.innerHTML = `
            <div class="input-row" style="background:#f8f9fa; padding:10px; border-radius:10px;">
                <input type="text" class="v_name" placeholder="नाम" style="flex:2">
                <select class="v_rishta" style="flex:1"><option>पुत्र</option><option>पुत्री</option><option>पत्नी</option></select>
                <select class="v_jivit" style="flex:1" onchange="toggleChildren('${nodeId}', this.value)"><option value="हाँ">जीवित</option><option value="नहीं">स्व०</option></select>
                <button type="button" class="btn btn-red" onclick="removeEl('${nodeId}')">X</button>
            </div>
            <div id="${nodeId}_child"></div>
            <button type="button" class="btn btn-blue hidden" id="${nodeId}_btn" style="padding:2px 10px; font-size:11px; margin-top:5px;" onclick="addVanshNode('${nodeId}_child')">+ संतान</button>
        `;
        parent.appendChild(div);
    }

    function toggleChildren(nodeId, value) {
        const btn = document.getElementById(nodeId + '_btn');
        if (value === 'नहीं') btn.classList.remove('hidden');
        else btn.classList.add('hidden');
    }

    // प्रिव्यू बटन फिक्स - अब काम करेगा
    function generatePreview() {
        let printHTML = '';
        
        // Page 1: मूल विवरण + फरीक लिस्ट + Stamp Box
        printHTML += `
        <div class="page">
            <div class="page-no">Page:-1</div>
            <div class="stamp-box">न्याय शुल्क टिकट</div>
            <div class="vertical-text v-sarpanch">हस्ताक्षर सरपंच</div>
            <div class="vertical-text v-gawah">हस्ताक्षर गवाह</div>
            <center><h3>पंचनामा बंटवारानामा</h3></center>
            <p><strong>न्यायालय:</strong> ${val('nyayalay')}, पंचायत- ${val('panchayat')}, अंचल- ${val('anchal')}, जिला- ${val('jila')}</p>
            <p><strong>वाद संo:</strong> ${val('vadNo')} <strong>दिनांक:</strong> ${formatDate(val('dinank'))}</p>
            <br>`;
        
        document.querySelectorAll('#farikenContainer > .farik-box').forEach((div, i) => {
            printHTML += `<p style="margin-bottom:10px;"><strong>${i+1}. लेख्यकारी :- फरीक नंo-${i+1}</strong> ${div.querySelector('.f_name').value} पिता- ${div.querySelector('.f_pita').value} उम्र- ${div.querySelector('.f_umar').value} वर्ष आधार:- ${div.querySelector('.f_aadhar').value} जाति- ${div.querySelector('.f_jati').value}, ग्राम- ${div.querySelector('.f_gram').value}, पंचायत- ${val('panchayat')}, अंचल- ${val('anchal')}, जिला- ${val('jila')}।</p>`;
        });
        printHTML += `</div>`;

        // Page 2: कुल पैत्रिक भूमि
        printHTML += `<div class="page"><div class="page-no">Page:-2</div>
        <div class="vertical-text v-sarpanch">हस्ताक्षर सरपंच</div><div class="vertical-text v-gawah">हस्ताक्षर गवाह</div>
        <p>2. लेख्यधारी:- एक दूसरे के पक्ष मे (लेख्यकारी ही लेख्यधारी है) ।</p>
        <p>3. लेख्यप्रकार:- ${val('lekhyaPrakar')}।</p>
        <p>4. लेख्यमूल्य:- ${val('lekhyaMulya')}</p>
        <p>5. सम्पत्ति भूमि:- ${val('sampatiBhumi')}।</p>
        <h3>कुल पैत्रिक भूमि सम्पत्ति विवरण:-</h3>
        <table><tr><th>मौजा का नाम</th><th>थाना नंo</th><th>खाता नंo</th><th>खेसरा नंo</th><th>रकवा (डिसमील)</th><th>रकवा (कठ्ठा-धूर)</th></tr>`;
        document.querySelectorAll('#bhumiTbody tr').forEach(tr => {
            printHTML += `<tr><td>${tr.querySelector('.b_mauja').value}</td><td>${tr.querySelector('.b_thana').value}</td><td>${tr.querySelector('.b_khata').value}</td><td>${tr.querySelector('.b_khesra').value}</td><td>${tr.querySelector('.b_rakwa_dis').value}</td><td>${tr.querySelector('.b_rakwa_kd').value}</td></tr>`;
        });
        printHTML += `</table><p><strong>कुल पैत्रिक भूमि रकवा (डिसमील)= ${document.getElementById('totalRakwa').innerText}</strong></p></div>`;

        // Page 3,4,5...: हर हिस्सेदार का विवरण
        document.querySelectorAll('#farikenContainer > .farik-box').forEach((div, i) => {
            const farikName = div.querySelector('.f_name').value;
            const farikPita = div.querySelector('.f_pita').value;
            const farikGram = div.querySelector('.f_gram').value;
            const tbodyId = `farik_bhumi_${div.id.split('_')[1]}`;
            
            printHTML += `<div class="page"><div class="page-no">Page:-${i+3}</div>
            <div class="vertical-text v-sarpanch">हस्ताक्षर सरपंच</div><div class="vertical-text v-gawah">हस्ताक्षर गवाह</div>
            <h3>सभी फरिकेन का भूमि सम्पत्ति हिस्सा विवरण</h3>
            <p><strong>${i==0?'प्रथम':i==1?'द्वितीय':i==2?'तृतीय':'चतुर्थ'} हिस्सेदार:- (फरीक नंo-${i+1}) ${farikName} पिता- ${farikPita} निवासी- ${farikGram}, अंचल- ${val('anchal')} |</strong></p>
            <table><tr><th>थाना नंo</th><th>खाता नंo</th><th>खेसरा नंo</th><th>रकवा (डिसमील)</th><th>रकवा (कठ्ठा-धूर)</th><th>चौहद्दी</th></tr>`;
            
            document.querySelectorAll(`#${tbodyId} tr`).forEach(tr => {
                printHTML += `<tr>
                    <td>${tr.querySelector('.b_thana')?.value || ''}</td>
                    <td>${tr.querySelector('.b_khata')?.value || ''}</td>
                    <td>${tr.querySelector('.b_khesra').value}</td>
                    <td>${tr.querySelector('.b_rakwa_dis').value}</td>
                    <td>${tr.querySelector('.b_rakwa_kd').value}</td>
                    <td style="white-space: pre-wrap;">${tr.querySelector('.b_chauhaddi').value}</td>
                </tr>`;
            });
            const totalFarike = div.querySelector('.farik_total').innerText;
            printHTML += `</table><p><strong>कुल भूमि हिस्सा, रकवा (डिसमील)= ${totalFarike}</strong></p></div>`;
        });

        // कानूनी शब्द वाला पेज - फिक्स्ड टेक्स्ट
        printHTML += `<div class="page"><div class="page-no">Page:-${farikCount+3}</div>
        <div class="vertical-text v-sarpanch">हस्ताक्षर सरपंच</div><div class="vertical-text v-gawah">हस्ताक्षर गवाह</div><div class="vertical-text v-fariken">हस्ताक्षर फरकेन</div>
        <p>आगे यह कि हम लोग एक ही खूंट खानदान के हैं और संयुक्त संपत्ति के सहभागी हैं जिसका पंचनामा बटवारा आपसी सहमति से शारीरिक व मानसिक स्वास्थयता में बिना किसी के दबाव, भड़काव व धमकाव में आकर निश्चित किया कि गांव समाज के कुछ प्रतिष्ठित पंचों व सरपंच के समक्ष समिलात खतियानी जमीन व समिलात खरीदारी केवाला की जमीन है। मुख्य रूप से जमीन की बटवारा कर लेना सही व मुनासिब समझता हूं ताकि वर्तमान पीढ़ी के वंशज को भविष्य में समिलात जमीन कि विवाद नहीं हो एवं सरकारी राजस्व का भुगतान भी समय-समय पर अपने हक हिस्सा के अनुसार किया करेंगे।</p>
        <p>यह कि अपने-अपने सिडूल की संपत्ति पर इस बटवारा के अनुसार दखलकार होकर सभी तरह का सुखभोग.. आदि किया करेंगे। और आज दिनांक- ${formatDate(val('dinank'))} से सभी फरिक अपने हिस्से का दाखिल खारिज कराकर राजस्व लगान रसीद काटा सकता है या सर्वे में अपने नाम से खाता खुलवा सकता है।</p>
        <p><strong>यह की उपर्युक्त पंचनामा बंटवारा के सभी हिस्सेदार व सिडूल धारी सही वह दूरस्थ मानकर अपना हस्ताक्षर एवं निशान बना दिया ताकि भविष्य में विवाद न हो।</strong></p>
        <div class="sign-area"><div><u>फरकेन का हस्ताक्षर</u></div><div><u>गवाह</u></div><div><u>फरकेन</u></div></div>
        </div>`;

        // वंशावली वाला पेज
        printHTML += `<div class="page"><div class="page-no">Page:-${farikCount+4}</div>
        <h3>वंशवृक्ष</h3>
        <div class="tree"><ul><li><div>${val('v_purvaj')}<br>पिता-${val('v_purvaj_pita')}</div>${buildVanshTree('vanshavaliChild', true)}</li></ul></div>
        <div class="sign-area"><div><u>गवाह का हस्ताक्षर</u></div><div><u>सरपंच</u></div><div><u>फरीकेन/हिस्सेदार का हस्ताक्षर</u></div></div>
        </div>`;

        document.getElementById('printArea').innerHTML = printHTML;
        document.getElementById('inputFormBox').classList.add('hidden');
        document.getElementById('previewSection').classList.remove('hidden');
        window.scrollTo(0, 0);
    }

    function buildVanshTree(containerId, isPreview = false) {
        const container = document.getElementById(containerId);
        if (!container.children.length) return '';
        let html = '<ul>';
        Array.from(container.children).forEach(child => {
            if (child.classList.contains('input-group')) return;
            const name = child.querySelector('.v_name').value;
            const rishta = child.querySelector('.v_rishta').value;
            const jivit = child.querySelector('.v_jivit').value;
            const childContainerId = child.id + '_child';
            const childrenHtml = buildVanshTree(childContainerId, isPreview);
            html += `<li><div>${rishta}- ${name} ${jivit === 'नहीं' ? '(स्व०)' : ''}</div>`;
            if (childrenHtml) html += childrenHtml;
            html += `</li>`;
        });
        html += '</ul>';
        return html;
    }

    function editForm() {
        document.getElementById('inputFormBox').classList.remove('hidden');
        document.getElementById('previewSection').classList.add('hidden');
    }

    function val(id) { return document.getElementById(id).value; }
    function formatDate(dateStr) {
        if (!dateStr) return '......../........';
        const d = new Date(dateStr);
        return d.toLocaleDateString('hi-IN');
    }

    function downloadPDF() {
        const element = document.getElementById('printArea');
        const opt = {
            margin: 0,
            filename: 'Panchnama_Batwara_Jameenseva.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true, windowWidth: 794 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
    }

    // शुरू में एक फरीक और एक जमीन का row डाल दो
    addFariken();
    addBhumi('bhumiTbody');
</script>
