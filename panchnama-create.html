<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>JameenSeva - Batwara Form</title>

<style>
body{
  font-family: "Noto Sans Devanagari", sans-serif;
  background:#f2f2f2;
}

/* PAGE STYLE */
.page{
  width: 210mm;
  min-height: 297mm;
  margin: 10px auto;
  padding: 20mm;
  background:white;
  border:1px solid #000;
  position:relative;
}

/* TITLE */
.title{
  text-align:center;
  font-weight:bold;
  font-size:20px;
  margin:10px 0;
}

/* INPUT */
input, select{
  padding:5px;
  margin:3px;
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}
table, th, td{
  border:1px solid black;
}
th, td{
  padding:5px;
  text-align:center;
}

/* VERTICAL TEXT */
.vertical{
  position:absolute;
  right:-40px;
  top:50%;
  transform: rotate(90deg);
  font-weight:bold;
}

/* BUTTON */
button{
  padding:8px 15px;
  margin:5px;
  cursor:pointer;
}

/* TREE */
.tree div{
  border:1px solid #000;
  display:inline-block;
  padding:5px 10px;
  margin:10px;
}

/* PRINT */
@media print{
  body{background:white;}
  .no-print{display:none;}
}
</style>

</head>

<body>

<div class="no-print">
<h2>JameenSeva Batwara Generator</h2>

<button onclick="addHissedar()">+ Hissedar</button>
<button onclick="addPlot()">+ Plot</button>
<button onclick="generate()">Preview</button>
<button onclick="window.print()">Print</button>
</div>

<hr>

<!-- INPUT AREA -->
<div id="inputArea" class="no-print">

<h3>Hissedar</h3>
<div id="hissedarList"></div>

<h3>Plot</h3>
<div id="plotList"></div>

</div>

<!-- OUTPUT -->
<div id="output"></div>

<script>

let hissedars = [];
let plots = [];

/* ADD HISSEDAR */
function addHissedar(){
  let id = Date.now();

  let html = `
  <div>
    <input placeholder="नाम" id="name_${id}">
    <input placeholder="पिता का नाम">
    <input placeholder="उम्र">
    <input placeholder="आधार">
  </div>
  `;

  document.getElementById("hissedarList").innerHTML += html;
}

/* ADD PLOT */
function addPlot(){
  let html = `
  <div>
    <input placeholder="मौजा">
    <input placeholder="थाना">
    <input placeholder="खाता">
    <input placeholder="खेसरा">
    <input placeholder="रकबा">
  </div>
  `;

  document.getElementById("plotList").innerHTML += html;
}

/* GENERATE DOCUMENT */
function generate(){

let page1 = `

</div>

</div>

let page3 = `

<table>

<th>थाना</th>

let page6 = `
<div class="page">
<p>
हम सभी सहमति से बटवारा कर रहे हैं और भविष्य में कोई विवाद नहीं होगा।

let page7 = `

</div>

</div>
`;

document.getElementById("output").innerHTML =
page1 + page2 + page3 + page6 + page7;

}

</script>

</body>
</html>
