<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>सहमति पंचनामा बटवारा - बिहार लीगल फॉर्मेट</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --primary: #1a237e;
            --secondary: #0d47a1;
            --success: #1b5e20;
            --danger: #b71c1c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: #f0f2f5; 
            padding: 20px; 
        }

        /* Dashboard UI */
        .container { max-width: 1200px; margin: auto; }
        .form-section { 
            background: white; 
            padding: 30px; 
            margin-bottom: 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: var(--primary); margin-bottom: 25px; }
        h3 { background: #f1f5f9; padding: 12px; border-radius: 8px; margin: 20px 0 15px; color: var(--secondary); font-size: 17px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid var(--secondary); }
        .input-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .input-group label { font-weight: 600; margin-bottom: 5px; font-size: 13px; color: #666; display: block; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-blue { background: var(--secondary); color: white; }
        .btn-green { background: var(--success); color: white; }
        .btn-red { background: var(--danger); color: white; }
        .farik-box { border: 1px solid #ddd; background: #fcfcfc; padding: 20px; margin-bottom: 20px; border-radius: 12px; }
        .hidden { display: none; }

        /* ===== PRINT / PDF SYSTEM (The Most Important Part) ===== */
        #printArea { 
            font-family: 'Noto Serif Devanagari', serif; 
            background: #ddd;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .page { 
            background: white;
            width: 210mm;
            height: 297mm;
            padding: 20mm;
            margin: 10mm 0;
            position: relative;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            page-break-after: always;
            border: 1px solid #000; /* Page Border as per images */
            box-sizing: border-box;
            overflow: hidden;
        }
        .page-no { text-align: center; font-weight: bold; margin-bottom: 10px; font-size: 14px; }
        .stamp-area { 
            position: absolute; top: 15mm; right: 15mm; 
            width: 40mm; height: 40mm; 
            border: 1px dashed #000; 
            text-align: center; font-size: 12px; padding-top: 10px;
        }
        .vertical-text { 
            position: absolute; 
            writing-mode: vertical-rl; 
            text-orientation: mixed; 
            font-weight: bold; 
            font-size: 14px; 
            text-transform: uppercase;
        }
        .v-sarpanch { left: 10mm; top: 40%; }
        .v-gawah { right: 10mm; top: 30%; }
        .v-fariken { right: 10mm; top: 60%; }

        .page h3 { background: none; padding: 0; border: none; text-align: center; text-decoration: underline; margin: 15px 0; font-size: 18px; color: #000; }
        .page p { text-align: justify; margin-bottom: 10px; line-height: 1.8; }
        .page table { width: 100%; border-collapse: collapse; margin: 15px 0; border: 1px solid #000; }
        .page th, .page td { border: 1px solid #000; padding: 8px; text-align: center; font-size: 13px; }
        .page th { background: #f2f2f2; }

        .sign-area { display: flex; justify-content: space-between; margin-top: 80px; font-weight: bold; text-align: center; }
        .sign-area div { width: 30%; border-top: 1px solid #000; padding-top: 5px; }

        /* Visual Family Tree (Vanshavali) */
        .tree-container { text-align: center; margin-top: 30px; }
        .tree ul { padding-top: 20px; position: relative; display: flex; justify-content: center; align-items: flex-start; }
        .tree li { list-style-type: none; position: relative; padding: 20px 5px 0 5px; }
        .tree li::before, .tree li::after { content: ''; position: absolute; top: 0; right: 50%; border-top: 1px solid #000; width: 50%; height: 20px; }
        .tree li::after { right: auto; left: 50%; border-left: 1px solid #000; }
        .tree li:only-child::after, .tree li:only-child::before { display: none; }
        .tree li:only-child { padding-top: 0; }
        .tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
        .tree li:last-child::before { border-right: 1px solid #000; border-radius: 0 5px 0 0; }
        .tree li:first-child::after { border-radius: 5px 0 0 0; }
        .tree ul ul::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 1px solid #000; width: 0; height: 20px; }
        .tree li div { border: 1px solid #000; padding: 5px 10px; border-radius: 4px; background: #fff; display: inline-block; font-weight: bold; font-size: 13px; min-width: 100px; }

        @media print {
            body { background: none; padding: 0; }
            .no-print { display: none !important; }
            #printArea { background: none; }
            .page { margin: 0; box-shadow: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- INPUT FORM -->
    <div class="form-section no-print" id="inputFormBox">
        <h2><i class="fas fa-file-signature"></i> बिहार सहमति पंचनामा बटवारा</h2>
        <form id="batwaraForm">
            
            <h3><i class="fas fa-info-circle"></i> 1. न्यायालय एवं अंचल विवरण</h3>
            <div class="input-row">
                <div class="input-group"><label>न्यायालय:</label><input type="text" id="nyayalay" value="सरपंच ग्राम कचहरी"></div>
                <div class="input-group"><label>पंचायत:</label><input type="text" id="panchayat" placeholder="उदा: भवानीपुर"></div>
                <div class="input-group"><label>अंचल:</label><input type="text" id="anchal" placeholder="उदा: सिंहवाड़ा"></div>
                <div class="input-group"><label>जिला:</label><input type="text" id="jila" placeholder="उदा: दरभंगा"></div>
                <div class="input-group"><label>वाद संख्या:</label><input type="text" id="vadNo" placeholder="01/2024"></div>
                <div class="input-group"><label>दिनांक:</label><input type="date" id="dinank"></div>
            </div>

            <h3><i class="fas fa-users"></i> 2. लेख्यकारी (फरीक) विवरण 
                <button type="button" class="btn btn-blue" onclick="addFariken()"><i class="fas fa-plus"></i> फरीक जोड़ें</button>
            </h3>
            <div id="farikenContainer"></div>

            <h3><i class="fas fa-map-marked-alt"></i> 3. कुल पैत्रिक भूमि विवरण
                <button type="button" class="btn btn-blue" onclick="addBhumi('bhumiTbody')"><i class="fas fa-plus"></i> जमीन जोड़ें</button>
            </h3>
            <table>
                <thead><tr><th>मौजा</th><th>थाना नं.</th><th>खाता नं.</th><th>खेसरा नं.</th><th>रकवा (डि.)</th><th>रकवा (क-धु)</th><th class="no-print">S</th></tr></thead>
                <tbody id="bhumiTbody"></tbody>
                <tfoot><tr style="background: #eee; font-weight: bold;"><td colspan="4">कुल रकवा (डिसमील) =</td><td id="totalRakwa" colspan="2">0.000</td></tr></tfoot>
            </table>

            <h3><i class="fas fa-sitemap"></i> 4. वंशावली (Family Tree)</h3>
            <div class="farik-box">
                <div class="input-row">
                    <div class="input-group"><label>मूल पूर्वज:</label><input type="text" id="v_purvaj" placeholder="स्व० मौजे साह"></div>
                    <div class="input-group"><label>पूर्वज के पिता:</label><input type="text" id="v_purvaj_pita" placeholder="स्व० बच्चे लाल साह"></div>
                </div>
                <div id="vanshavaliChild"></div>
                <button type="button" class="btn btn-blue" onclick="addVanshNode('vanshavaliChild')"><i class="fas fa-child"></i> सदस्य जोड़ें</button>
            </div>

            <div style="text-align: center; margin-top: 40px;">
                <button type="button" class="btn btn-green" style="padding: 15px 40px; font-size: 18px;" onclick="generatePreview()">
                    <i class="fas fa-eye"></i> दस्तावेज़ प्रिव्यू देखें
                </button>
            </div>
        </form>
    </div>

    <!-- PREVIEW SECTION -->
    <div class="form-section hidden" id="previewSection">
        <div class="no-print" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2><i class="fas fa-file-pdf"></i> दस्तावेज़ प्रिव्यू</h2>
            <div>
                <button class="btn btn-green" onclick="window.print()"><i class="fas fa-print"></i> प्रिंट</button>
                <button class="btn btn-red" onclick="downloadPDF()"><i class="fas fa-download"></i> PDF</button>
                <button class="btn btn-blue" onclick="editForm()"><i class="fas fa-edit"></i> एडिट</button>
            </div>
        </div>
        <div id="printArea"></div>
    </div>
</div>

<script>
    let farikCount = 0;

    function addFariken() {
        farikCount++;
        const html = `
        <div class="farik-box" id="farik_${farikCount}">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <strong>फरीक नंo-${farikCount}</strong>
                <button type="button" class="btn btn-red" style="padding:2px 8px;" onclick="removeEl('farik_${farikCount}')">X</button>
            </div>
            <div class="input-row">
                <div class="input-group"><label>नाम:</label><input type="text" class="f_name"></div>
                <div class="input-group"><label>पिता/पति:</label><input type="text" class="f_pita"></div>
                <div class="input-group"><label>उम्र:</label><input type="number" class="f_umar"></div>
                <div class="input-group"><label>आधार:</label><input type="text" class="f_aadhar"></div>
                <div class="input-group"><label>ग्राम:</label><input type="text" class="f_gram"></div>
            </div>
            <h4 style="margin:10px 0; font-size:14px;">हिस्सा भूमि विवरण <button type="button" class="btn btn-blue" style="padding:2px 8px; font-size:11px;" onclick="addBhumi('f_bhumi_${farikCount}')">+ जोड़ें</button></h4>
            <table>
                <thead><tr><th>खेसरा</th><th>रकवा(डि०)</th><th>रकवा(क०-धु०)</th><th>चौहद्दी</th><th class="no-print">X</th></tr></thead>
                <tbody id="f_bhumi_${farikCount}"></tbody>
                <tfoot><tr><td colspan="1">कुल हिस्सा:</td><td class="f_total" style="font-weight:bold">0.000</td><td colspan="3"></td></tr></tfoot>
            </table>
        </div>`;
        document.getElementById('farikenContainer').insertAdjacentHTML('beforeend', html);
        addBhumi(`f_bhumi_${farikCount}`);
    }

    function addBhumi(tbodyId) {
        const tr = document.createElement('tr');
        const uid = Date.now() + Math.random();
        tr.id = `row_${uid}`;
        let isMain = (tbodyId === 'bhumiTbody');
        tr.innerHTML = `
            ${isMain ? '<td class="b_mauja"><input type="text"></td><td class="b_thana"><input type="text"></td><td class="b_khata"><input type="text"></td>' : ''}
            <td class="b_khesra"><input type="text"></td>
            <td class="b_rakwa"><input type="number" step="0.001" oninput="calcTotal('${tbodyId}')"></td>
            <td class="b_kd"><input type="text"></td>
            ${!isMain ? '<td><textarea class="b_chauhaddi" rows="1"></textarea></td>' : ''}
            <td class="no-print"><button type="button" class="btn btn-red" style="padding:2px 5px;" onclick="removeRow('${uid}', '${tbodyId}')">X</button></td>
        `;
        document.getElementById(tbodyId).appendChild(tr);
    }

    function removeRow(id, tbodyId) { document.getElementById(`row_${id}`).remove(); calcTotal(tbodyId); }
    function removeEl(id) { document.getElementById(id).remove(); }

    function calcTotal(tbodyId) {
        let total = 0;
        document.querySelectorAll(`#${tbodyId} .b_rakwa input`).forEach(input => {
            total += parseFloat(input.value) || 0;
        });
        if (tbodyId === 'bhumiTbody') document.getElementById('totalRakwa').innerText = total.toFixed(3);
        else document.querySelector(`#${tbodyId}`).closest('table').querySelector('.f_total').innerText = total.toFixed(3);
    }

    function addVanshNode(parentId) {
        const parent = document.getElementById(parentId);
        const nodeId = 'vnode_' + Date.now();
        const div = document.createElement('div');
        div.id = nodeId;
        div.style.cssText = 'margin-left: 20px; border-left: 2px solid #ddd; padding-left: 15px; margin-bottom: 10px;';
        div.innerHTML = `
            <div class="input-row" style="background:#f9f9f9; padding:10px; border-radius:5px;">
                <input type="text" class="v_name" placeholder="नाम">
                <select class="v_rel"><option>पुत्र</option><option>पुत्री</option><option>पत्नी</option></select>
                <select class="v_stat" onchange="toggleVChild('${nodeId}', this.value)"><option value="जीवित">जीवित</option><option value="मृत">स्व०</option></select>
                <button type="button" class="btn btn-red" onclick="removeEl('${nodeId}')">X</button>
            </div>
            <div id="${nodeId}_child"></div>
            <button type="button" class="btn btn-blue hidden" id="${nodeId}_btn" style="font-size:11px;" onclick="addVanshNode('${nodeId}_child')">+ संतान</button>
        `;
        parent.appendChild(div);
    }

    function toggleVChild(id, val) {
        document.getElementById(id + '_btn').classList.toggle('hidden', val === 'जीवित');
    }

    function generatePreview() {
        let printHTML = '';
        
        // PAGE 1
        printHTML += `<div class="page">
            <div class="page-no">Page:-1</div>
            <div class="stamp-area">न्याय शुल्क टिकट<br>(Stamps Area)</div>
            <div class="vertical-text v-sarpanch">हस्ताक्षर सरपंच</div>
            <div class="vertical-text v-gawah">हस्ताक्षर गवाह</div>
            <center><h3>सहमति पंचनामा बटवारा</h3></center>
            <p><strong>न्यायालय:</strong> ${val('nyayalay')}, पंचायत- ${val('panchayat')}, अंचल- ${val('anchal')}, जिला- ${val('jila')}</p>
            <p><strong>वाद सं०:</strong> ${val('vadNo')} &nbsp;&nbsp;&nbsp;&nbsp; <strong>दिनांक:</strong> ${formatDate(val('dinank'))}</p>
            <br>
            <p style="text-align:center; font-weight:bold; font-size:16px; text-decoration:underline;">लेख्यकारी विवरण</p>`;
        
        document.querySelectorAll('#farikenContainer > .farik-box').forEach((div, i) => {
            printHTML += `<p><strong>${i+1}. फरीक नं०-${i+1} :-</strong> ${div.querySelector('.f_name').value} पिता- ${div.querySelector('.f_pita').value}, उम्र- ${div.querySelector('.f_umar').value} वर्ष, आधार- ${div.querySelector('.f_aadhar').value}, जाति- ${div.querySelector('.f_jati')?.value || '---'}, ग्राम- ${div.querySelector('.f_gram').value}, पंचायत- ${val('panchayat')}, अंचल- ${val('anchal')}, जिला- ${val('jila')}।</p>`;
        });
        printHTML += `</div>`;

        // PAGE 2
        printHTML += `<div class="page">
            <div class="page-no">Page:-2</div>
            <div class="vertical-text v-sarpanch">हस्ताक्षर सरपंच</div>
            <div class="vertical-text v-gawah">हस्ताक्षर गवाह</div>
            <p><strong>2. लेख्यधारी:-</strong> एक दूसरे के पक्ष में (लेख्यकारी ही लेख्यधारी है)।</p>
            <p><strong>3. लेख्यप्रकार:-</strong> ${val('lekhyaPrakar') || 'आपसी सहमति पंचनामा बटवारा'}।</p>
            <p><strong>4. लेख्यमूल्य:-</strong> ${val('lekhyaMulya') || 'शून्य'}।</p>
            <p><strong>5. सम्पत्ति भूमि:-</strong> ${val('sampatiBhumi') || 'पैत्रिक जमीन जाइदाद'}।</p>
            <h3>कुल पैत्रिक भूमि सम्पत्ति विवरण:-</h3>
            <table>
                <thead><tr><th>मौजा</th><th>थाना नं.</th><th>खाता नं.</th><th>खेसरा नं.</th><th>रकवा (डि.)</th><th>रकवा (क-धु)</th></tr></thead>
                <tbody>`;
        document.querySelectorAll('#bhumiTbody tr').forEach(tr => {
            printHTML += `<tr><td>${tr.querySelector('.b_mauja input').value}</td><td>${tr.querySelector('.b_thana input').value}</td><td>${tr.querySelector('.b_khata input').value}</td><td>${tr.querySelector('.b_khesra input').value}</td><td>${tr.querySelector('.b_rakwa input').value}</td><td>${tr.querySelector('.b_kd input').value}</td></tr>`;
        });
        printHTML += `</tbody></table><p><strong>कुल पैत्रिक भूमि रकवा (डिसमील) = ${document.getElementById('totalRakwa').innerText}</strong></p></div>`;

        // FARIKEN PAGES (3, 4, 5...)
        document.querySelectorAll('#farikenContainer > .farik-box').forEach((div, i) => {
            const fIdx = i+1;
            const tbodyId = `f_bhumi_${div.id.split('_')[1]}`;
            printHTML += `<div class="page">
                <div class="page-no">Page:-${i+3}</div>
                <div class="vertical-text v-sarpanch">हस्ताक्षर सरपंच</div>
                <div class="vertical-text v-gawah">हस्ताक्षर गवाह</div>
                <h3>सभी फरीकेन का भूमि सम्पत्ति हिस्सा विवरण</h3>
                <p><strong>${i==0?'प्रथम':i==1?'द्वितीय':'तृतीय'} हिस्सेदार:- (फरीक नंo-${fIdx}) ${div.querySelector('.f_name').value} पिता- ${div.querySelector('.f_pita').value} निवासी- ${div.querySelector('.f_gram').value}, अंचल- ${val('anchal')}।</strong></p>
                <table>
                    <thead><tr><th>थाना नं.</th><th>खाता नं.</th><th>खेसरा नं.</th><th>रकवा (डि.)</th><th>रकवा (क-धु)</th><th>चौहद्दी</th></tr></thead>
                    <tbody>`;
            document.querySelectorAll(`#${tbodyId} tr`).forEach(tr => {
                printHTML += `<tr>
                    <td>${tr.querySelector('.b_khesra input').value}</td>
                    <td>-</td><td>-</td>
                    <td>${tr.querySelector('.b_rakwa input').value}</td>
                    <td>${tr.querySelector('.b_kd input').value}</td>
                    <td style="text-align:left;">${tr.querySelector('.b_chauhaddi').value}</td>
                </tr>`;
            });
            printHTML += `</tbody></table><p><strong>कुल हिस्सा रकवा (डिसमील)= ${div.querySelector('.f_total').innerText}</strong></p></div>`;
        });

        // LEGAL DECLARATION PAGE
        printHTML += `<div class="page">
            <div class="page-no">Page:-${farikCount+3}</div>
            <div class="vertical-text v-sarpanch">हस्ताक्षर सरपंच</div>
            <div class="vertical-text v-gawah">हस्ताक्षर गवाह</div>
            <div class="vertical-text v-fariken">हस्ताक्षर फरीकेन</div>
            <p>आगे यह कि हम लोग एक ही खूंट खानदान के हैं और संयुक्त संपत्ति के सहभागी हैं जिसका पंचनामा बटवारा आपसी सहमति से शारीरिक व मानसिक स्वास्थ्यता में बिना किसी के दबाव, भड़काव व धमकाव में आकर निश्चित किया कि गांव समाज के कुछ प्रतिष्ठित पंचों व सरपंच के समक्ष समिलात खतियानी जमीन व समिलात खरीदारी केवाला की जमीन है। मुख्य रूप से जमीन की बटवारा कर लेना सही व मुनासिब समझता हूं ताकि वर्तमान पीढ़ी के वंशज को भविष्य में विवाद न हो।</p>
            <p>यह कि अपने-अपने सिड्यूल की संपत्ति पर इस बटवारा के अनुसार दखलकार होकर सभी तरह का सुखभोग करेंगे। और आज दिनांक ${formatDate(val('dinank'))} से सभी फरीक अपने हिस्से का दाखिल खारिज कराकर राजस्व लगान रसीद काटा सकते हैं।</p>
            <p><strong>यह कि उपर्युक्त पंचनामा बंटवारा के सभी हिस्सेदार सही व दूरस्थ मानकर अपना हस्ताक्षर एवं निशान बना दिया ताकि भविष्य में विवाद न हो।</strong></p>
            <div class="sign-area"><div>फरीकेन का हस्ताक्षर</div><div>गवाह</div><div>सरपंच</div></div>
        </div>`;

        // VANSHAVALI PAGE
        printHTML += `<div class="page">
            <div class="page-no">Page:-${farikCount+4}</div>
            <h3>वंशवृक्ष (Vanshavali)</h3>
            <div class="tree-container">
                <div class="tree">
                    <ul>
                        <li><div>${val('v_purvaj')}<br><small>पिता- ${val('v_purvaj_pita')}</small></div>
                        ${buildTreeHTML('vanshavaliChild')}
                        </li>
                    </ul>
                </div>
            </div>
            <div class="sign-area" style="margin-top:150px;"><div>गवाह</div><div>सरपंच</div><div>फरीकेन</div></div>
        </div>`;

        document.getElementById('printArea').innerHTML = printHTML;
        document.getElementById('inputFormBox').classList.add('hidden');
        document.getElementById('previewSection').classList.remove('hidden');
    }

    function buildTreeHTML(containerId) {
        const container = document.getElementById(containerId);
        if (!container || !container.children.length) return '';
        let html = '<ul>';
        Array.from(container.children).forEach(child => {
            const name = child.querySelector('.v_name').value;
            const rel = child.querySelector('.v_rel').value;
            const stat = child.querySelector('.v_stat').value;
            const childId = child.id + '_child';
            html += `<li><div>${rel}- ${name} ${stat === 'मृत' ? '(स्व०)' : ''}</div>${buildTreeHTML(childId)}</li>`;
        });
        html += '</ul>';
        return html;
    }

    function editForm() {
        document.getElementById('inputFormBox').classList.remove('hidden');
        document.getElementById('previewSection').classList.add('hidden');
    }

    function val(id) { return document.getElementById(id).value; }
    function formatDate(d) { return d ? new Date(d).toLocaleDateString('hi-IN') : '..../..../....'; }

    function downloadPDF() {
        const element = document.getElementById('printArea');
        html2pdf().set({
            margin: 0,
            filename: 'Bihar_Batwara_Panchnama.pdf',
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        }).from(element).save();
    }

    // Init
    addFariken();
    addBhumi('bhumiTbody');
</script>

</body>
</html>
