<!DOCTYPE html>
<html lang="hi">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3881463813155829"
     crossorigin="anonymous"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bihar District Land Record | सभी जिलों की जमीन जानकारी</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f6fb;
}

header{
background:#1565c0;
color:white;
text-align:center;
padding:20px;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
}

.card{
background:white;
padding:15px;
border-radius:8px;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
text-align:center;
}

.btn{
display:block;
margin:6px 0;
padding:8px;
background:#1976d2;
color:white;
text-decoration:none;
border-radius:5px;
}

.btn2{
display:block;
margin:6px 0;
padding:8px;
background:#43a047;
color:white;
text-decoration:none;
border-radius:5px;
}

footer{
margin-top:40px;
background:#222;
color:white;
text-align:center;
padding:15px;
}

</style>
</head>

<body>

<header>
<h1>बिहार के सभी जिलों का जमीन रिकॉर्ड</h1>
<p>Khata | Khesra | Jamabandi | Land Record</p>
</header>

<div class="container">

<div class="grid">

<!-- 38 District -->

<script>
let districts = [
    "Araria","Arwal","Aurangabad","Banka","Begusarai","Bhagalpur",
    "Bhojpur","Buxar","Darbhanga","East Champaran","Gaya","Gopalganj",
    "Jamui","Jehanabad","Kaimur","Katihar","Khagaria","Kishanganj",
    "Lakhisarai","Madhepura","Madhubani","Munger","Muzaffarpur",
    "Nalanda","Nawada","Patna","Purnea","Rohtas","Saharsa",
    "Samastipur","Saran","Sheikhpura","Sheohar","Sitamarhi",
    "Siwan","Supaul","Vaishali","West Champaran"
];

districts.forEach(d => {
    // District name ko file name format mein badalne ke liye (e.g. "Patna" -> "patna.html")
    let fileName = d.toLowerCase().replace(/ /g, "-") + ".html";

    document.write(`
        <div class="card">
            <h3>${d}</h3>
            
            <a class="btn" href="${fileName}">
                खतियान / खाता देखें
            </a>

            <a class="btn2" href="${fileName}#jamabandi">
                जमाबंदी / रसीद देखें
            </a>
        </div>
    `);
});
</script>
</div>

</div>

<footer>
© 2026 JameenSeva.in
</footer>

</body>
</html>
