const districtSelect = document.getElementById("district");
for (let dist in biharData) {
    let opt = document.createElement("option");
    opt.value = dist; opt.innerHTML = dist;
    districtSelect.appendChild(opt);
}

function loadBlocks() {
    const blockSelect = document.getElementById("block");
    const selectedDist = districtSelect.value;
    blockSelect.innerHTML = '<option value="">-- ब्लॉक चुनें --</option>';
    if (selectedDist) {
        biharData[selectedDist].forEach(block => {
            let opt = document.createElement("option");
            opt.value = block; opt.innerHTML = block;
            blockSelect.appendChild(opt);
        });
    }
}

async function submitOrder() {
    const btn = document.getElementById("submit-btn");
    const mobile = document.getElementById("mobile").value;
    const dist = document.getElementById("district").value;

    if(!dist || mobile.length < 10) {
        alert("कृपया जिला और सही मोबाइल नंबर भरें!"); return;
    }

    btn.disabled = true;
    btn.innerText = "डेटा सुरक्षित किया जा रहा है...";

    const trackingID = "JS-" + Math.floor(1000 + Math.random() * 9000);
    const khatiyanType = document.querySelector('input[name="khatiyan_type"]:checked').value;

    // Supabase Insert Call
    const { data, error } = await _supabase
      .from('khatiyan order')
      .insert([
        { 
            order_id: trackingID,
            order_date: new Date().toLocaleDateString('hi-IN'),
            district: dist,
            block: document.getElementById("block").value,
            thana_no: document.getElementById("thana_no").value,
            village: document.getElementById("village").value,
            khata_no: document.getElementById("khata_no").value,
            khesra_no: document.getElementById("khesra_no").value,
            khatiyan_type: khatiyanType,
            raiyat_name: document.getElementById("raiyat_name").value,
            full_address: document.getElementById("full_address").value,
            pincode: document.getElementById("pincode").value,
            mobile: mobile,
            status: 'Order Received'
        }
      ]);

    if (error) {
        alert("Error! डेटा सुरक्षित नहीं हुआ: " + error.message);
        btn.disabled = false;
        btn.innerText = "ऑर्डर बुक करें (Confirm Order)";
    } else {
        showSuccessPage(trackingID);
    }
}

            </div>

                <p style="margin:15px 0; font-weight:bold; color:#aaa;">──────── OR ────────</p>
                <button onclick="confirmCOD('${id}')" class="btn-cod">Cash on Delivery (COD)</button>
            </div>
            <a href="track.html" style="display:block; background:#005689; color:white; text-decoration:none; padding:12px; border-radius:6px; font-weight:bold; margin-top:20px;">
                📦 ऑर्डर ट्रैक करें
            </a>
        </div>
    `;

    const myForm = document.createElement("form");
    const rpScript = document.createElement("script");
    rpScript.src = "https://checkout.razorpay.com/v1/payment-button.js";
    rpScript.setAttribute("data-payment_button_id", "pl_SCKTQmKjqJ35JV");
    rpScript.async = true;
    myForm.appendChild(rpScript);
    document.getElementById("razorpay-form").appendChild(myForm);
}

function confirmCOD(id) {
    alert("आपका COD ऑर्डर (ID: " + id + ") स्वीकार कर लिया गया है।");
    window.location.reload();
