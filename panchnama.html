const dSelect = document.getElementById("district");
for (let d in biharData) {
    let o = document.createElement("option"); o.value = d; o.innerHTML = d;
    dSelect.appendChild(o);
}

function loadBlocks() {
    const bSelect = document.getElementById("block");
    bSelect.innerHTML = '<option value="">-- ब्लॉक चुनें --</option>';
    if (dSelect.value) {
        biharData[dSelect.value].forEach(b => {
            let o = document.createElement("option"); o.value = b; o.innerHTML = b;
            bSelect.appendChild(o);
        });
    }
}

async function submitOrder() {
    const btn = document.getElementById("submit-btn");
    const status = document.getElementById("status-msg");
    const fileIn = document.getElementById("user_file");
    const mobile = document.getElementById("mobile").value;

    if(!mobile || mobile.length < 10) { alert("सही मोबाइल नंबर भरें!"); return; }
    if(fileIn.files.length === 0) { alert("कृपया फाइल चुनें!"); return; }

    btn.disabled = true;
    status.style.display = "block";

    const file = fileIn.files[0];
    const trackingID = "PAN-" + Math.floor(1000 + Math.random() * 9000);
    
    const reader = new FileReader();
    reader.onload = async function(e) {
        const base64Data = e.target.result.split(',')[1];
        const scriptURL = "YOUR_APPS_SCRIPT_URL_HERE"; // यहाँ अपना नया Apps Script URL डालें
        
        try {
            // 1. UPLOAD TO DRIVE AND GET LINK
            const driveResp = await fetch(scriptURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `data=${encodeURIComponent(base64Data)}&mimetype=${encodeURIComponent(file.type)}&filename=${encodeURIComponent(file.name)}`
            });

            const driveData = await driveResp.json();
            const driveLink = driveData.url;

            // 2. UPLOAD TO SHEETDB
            const formData = {
                "ORDER ID": trackingID,
                "Status": "PENDING",
                "DATE": new Date().toLocaleDateString('hi-IN'),
                "जिला": document.getElementById("district").value,
                "प्रखंड": document.getElementById("block").value,
                "मौजा/गाँव": document.getElementById("village").value,
                "थाना नंबर": document.getElementById("thana_no").value,
                "रैयत का नाम(यदि हो)": document.getElementById("raiyatname").value,
                "अपना नाम के साथ पूरा पता": document.getElementById("full_address").value,
                "पिन कोड": document.getElementById("pincode").value,
                "अमीन या खुद के द्वारा बनाया हुआ रौफ शेड्यूल,सभी हिस्सेदार का आधार और सादे कागज पर वंशावली बनाकर सभी का एक pdf अपलोड करें": driveLink,
                "अपना मोबाइल नंबर": mobile
            };

            const sheetResponse = await fetch('https://sheetdb.io/api/v1/tethdim34qjsy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ data: [formData] })
            });

            if(sheetResponse.ok) {
                alert("✅ सफलता! लिंक शीट में सेव हो गया। ID: " + trackingID);
                location.reload();
            }

        } catch (err) {
            alert("त्रुटि: " + err.message);
            btn.disabled = false;
            status.style.display = "none";
        }
    };
    reader.readAsDataURL(file);
}
