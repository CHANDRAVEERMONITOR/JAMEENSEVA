Object.keys(biharData).sort().forEach(d => {

});

function loadBlocks() {
    const bSelect = document.getElementById("block");
    bSelect.innerHTML = '<option value="">-- ब्लॉक चुनें --</option>';
    if (dSelect.value) {
        biharData[dSelect.value].sort().forEach(b => {
            let o = document.createElement("option"); o.value = b; o.innerHTML = b;
            bSelect.appendChild(o);
        });
    }
}

async function submitOrder() {
    const btn = document.getElementById("submit-btn");
    const status = document.getElementById("status-msg");
    const fileIn = document.getElementById("user_file");
    const mobile = document.getElementById("mobile").value;

    if(!mobile || mobile.length < 10) { alert("सही मोबाइल नंबर भरें!"); return; }
    if(fileIn.files.length === 0) { alert("कृपया PDF फाइल चुनें!"); return; }

    btn.disabled = true;
    status.style.display = "block";

    const file = fileIn.files[0];
    const trackingID = "PAN-" + Math.floor(1000 + Math.random() * 9000);
    const fileName = `${trackingID}_${Date.now()}.pdf`;

    try {
        // 1. UPLOAD TO STORAGE
        const { data: uploadData, error: uploadError } = await _supabase.storage
            .from('panchnama-order-files')
            .upload(fileName, file);

        if (uploadError) throw uploadError;

        const { data: urlData } = _supabase.storage
            .from('panchnama-order-files')
            .getPublicUrl(fileName);
        const fileLink = urlData.publicUrl;

        // 2. INSERT INTO SUPABASE TABLE (Column names fixed as per your screenshot)
        const { error: dbError } = await _supabase
            .from('panchnama batwara')
            .insert([
                { 
                    order_id: trackingID, 
                    order_date: new Date().toLocaleDateString('hi-IN'),
                    district: document.getElementById("district").value,
                    block: document.getElementById("block").value,
                    thana_no: document.getElementById("thana_no").value,
                    village: document.getElementById("village").value,
                    raiyat_name: document.getElementById("raiyatname").value, // Fixed name
                    full_address: document.getElementById("full_address").value,
                    pincode: document.getElementById("pincode").value,
                    mobile: mobile,
                    status: "PENDING",
                    file_url: fileLink // Fixed name as per screenshot
                }
            ]);

        if (dbError) throw dbError;

        // 3. TELEGRAM NOTIFICATION
        const message = `🚀 *New Panchnama Order!* \n\n` +
                        `🆔 *ID:* ${trackingID}\n` +
                        `📍 *Dist:* ${document.getElementById("district").value}\n` +
                        `🏢 *Block:* ${document.getElementById("block").value}\n` +
                        `🏡 *Village:* ${document.getElementById("village").value}\n` +
                        `📞 *Mobile:* ${mobile}\n\n` +
                        `📄 *File Link:* ${fileLink}`;

        await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: TELEGRAM_CHAT_ID,
                text: message,
                parse_mode: 'Markdown'
            })
        });

        alert("✅ सफलता! ऑर्डर डेटाबेस में सेव हो गया और टेलीग्राम पर भेज दिया गया। ID: " + trackingID);
        location.reload();

    } catch (err) {
        alert("त्रुटि: " + err.message);
        btn.disabled = false;
        status.style.display = "none";
    }
}
