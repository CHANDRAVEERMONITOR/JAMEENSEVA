<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Quotation Generator - 5 Layouts</title>
  <style>
    @page {
      size: A4;
      margin: 0;
    }
    
    :root {
      --primary: #0f172a;
      --secondary: #2563eb;
      --accent: #f8fafc;
      --text: #1e293b;
      --border: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; font-size: 14px; }

    .app-container { display: flex; gap: 20px; max-width: 1600px; margin: 0 auto; height: 95vh; }
    
    /* Control Panel */
    .control-panel {
      flex: 1.1;
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      overflow-y: auto;
      border: 1px solid #334155;
    }

    .control-panel h2 { color: #38bdf8; font-size: 20px; margin-bottom: 15px; border-bottom: 2px solid #334155; padding-bottom: 10px; }
    .control-group { margin-bottom: 20px; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; }
    .control-group h3 { color: #f1f5f9; font-size: 13px; margin-bottom: 12px; text-transform: uppercase; }
    
    label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 4px; color: #94a3b8; text-transform: uppercase; }
    input, select, textarea { width: 100%; padding: 8px 10px; margin-bottom: 10px; border: 1px solid #334155; background: #1e293b; color: #f8fafc; border-radius: 6px; font-size: 13px; }

    .color-pickers { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .color-pickers input { height: 38px; padding: 2px; cursor: pointer; }

    .item-row { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
    .item-row input { margin-bottom: 0; }
    
    .btn { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
    .btn-add { background: #10b981; color: white; width: 100%; margin-top: 5px; }
    .btn-remove { background: #ef4444; color: white; padding: 8px 10px; }
    .btn-print { background: #38bdf8; color: #0f172a; width: 100%; padding: 14px; font-size: 16px; margin-top: 10px; font-weight: 700; }

    /* Preview Panel */
    .preview-panel {
      flex: 1.9;
      background: #334155;
      padding: 20px;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      overflow-y: auto;
    }

    /* Fixed A4 Paper Styling */
    .quotation-paper {
      background: #ffffff;
      color: #1e293b;
      width: 210mm;
      min-height: 297mm;
      padding: 15mm 15mm 20mm 15mm;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      display: block;
      position: relative;
      box-sizing: border-box;
    }

    /* ==================== FORMAT 1: CORPORATE EXECUTIVE ==================== */
    .layout-corporate { border-top: 10px solid var(--primary); }
    .layout-corporate .q-header { display: flex; justify-content: space-between; border-bottom: 2px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
    .layout-corporate .badge { background: var(--primary); color: white; padding: 6px 18px; border-radius: 20px; font-weight: 700; font-size: 16px; display: inline-block; }
    .layout-corporate table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    .layout-corporate th { background: var(--primary); color: white; padding: 10px 12px; text-align: left; font-size: 12px; }
    .layout-corporate td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }

    /* ==================== FORMAT 2: MODERN MINIMALIST ==================== */
    .layout-minimal .q-header { text-align: center; border-bottom: 2px solid var(--primary); padding-bottom: 15px; margin-bottom: 20px; }
    .layout-minimal .q-title { font-size: 28px; font-weight: 300; letter-spacing: 4px; color: var(--primary); text-transform: uppercase; margin-bottom: 8px; }
    .layout-minimal table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    .layout-minimal th { border-bottom: 2px solid var(--primary); color: var(--primary); padding: 8px 10px; text-align: left; font-size: 12px; text-transform: uppercase; }
    .layout-minimal td { padding: 10px; border-bottom: 1px dashed var(--border); font-size: 13px; }

    /* ==================== FORMAT 3: CREATIVE COLOR BLOCK ==================== */
    .layout-creative { border-left: 14px solid var(--primary); }
    .layout-creative .q-header { background: var(--accent); padding: 20px; border-radius: 6px; display: flex; justify-content: space-between; margin-bottom: 20px; border: 1px solid var(--border); }
    .layout-creative table { width: 100%; border-collapse: separate; border-spacing: 0 6px; margin-top: 10px; }
    .layout-creative th { background: var(--secondary); color: white; padding: 10px; font-size: 12px; }
    .layout-creative th:first-child { border-radius: 4px 0 0 4px; }
    .layout-creative th:last-child { border-radius: 0 4px 4px 0; }
    .layout-creative td { background: var(--accent); padding: 10px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }

    /* ==================== FORMAT 4: ELEGANT LUXURY ==================== */
    .layout-luxury { border: 2px solid var(--primary); margin: 0; }
    .layout-luxury .q-header { text-align: left; border-bottom: 1px solid var(--primary); padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-end; }
    .layout-luxury .q-title { font-size: 24px; font-family: 'Georgia', serif; color: var(--primary); letter-spacing: 2px; }
    .layout-luxury table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    .layout-luxury th { border-top: 1px solid var(--primary); border-bottom: 1px solid var(--primary); color: var(--primary); padding: 8px 10px; font-family: 'Georgia', serif; }
    .layout-luxury td { padding: 10px; border-bottom: 1px solid var(--border); }

    /* ==================== FORMAT 5: TECH DASHBOARD ==================== */
    .layout-tech .q-header { background: var(--primary); color: white; padding: 18px; border-radius: 6px; display: flex; justify-content: space-between; margin-bottom: 20px; }
    .layout-tech .q-header h1 { color: #ffffff !important; }
    .layout-tech .q-header p { color: #e2e8f0 !important; }
    .layout-tech table { width: 100%; border-collapse: collapse; margin-top: 15px; border: 1px solid var(--border); }
    .layout-tech th { background: var(--accent); color: var(--primary); padding: 8px 10px; border: 1px solid var(--border); font-size: 12px; text-transform: uppercase; }
    .layout-tech td { padding: 10px; border: 1px solid var(--border); font-size: 13px; }

    /* Content Layout Elements */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
    .info-box { background: var(--accent); padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border); font-size: 12px; }
    .info-box strong { color: var(--primary); font-size: 13px; }

    .totals-section { display: flex; justify-content: flex-end; margin-top: 15px; margin-bottom: 30px; }
    .totals-table { width: 260px; border-collapse: collapse; }
    .totals-table td { padding: 5px 8px; font-size: 13px; }
    .totals-table tr.grand-total { font-weight: 700; font-size: 15px; color: var(--primary); border-top: 2px solid var(--primary); border-bottom: 2px solid var(--primary); }

    .q-footer { margin-top: 40px; padding-top: 15px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-end; font-size: 11px; }
    .signature-container { text-align: center; width: 180px; }
    .signature-line { border-top: 1px solid var(--primary); margin-top: 35px; padding-top: 4px; font-weight: 600; color: var(--primary); }

    /* Print Setup */
    @media print {
      body { background: transparent; padding: 0; }
      .control-panel { display: none !important; }
      .preview-panel { background: transparent; padding: 0; overflow: visible; display: block; }
      .quotation-paper {
        width: 210mm !important;
        min-height: 297mm !important;
        box-shadow: none !important;
        padding: 15mm !important;
        margin: 0 auto !important;
      }
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Controls Panel -->
  <div class="control-panel">
    <h2>Quotation Generator</h2>

    <div class="control-group">
      <h3>1. Select Layout & Colors</h3>
      <label>Choose 1 of 5 Formats</label>
      <select id="layoutSelect" onchange="updateLayout()">
        <option value="layout-corporate">1. Corporate Executive</option>
        <option value="layout-minimal">2. Modern Minimalist</option>
        <option value="layout-creative">3. Creative Color Block</option>
        <option value="layout-luxury">4. Elegant Luxury</option>
        <option value="layout-tech">5. Tech Dashboard</option>
      </select>

      <div class="color-pickers">
        <div>
          <label>Primary</label>
          <input type="color" id="primaryColor" value="#0f172a" onchange="updateColors()">
        </div>
        <div>
          <label>Secondary</label>
          <input type="color" id="secondaryColor" value="#2563eb" onchange="updateColors()">
        </div>
        <div>
          <label>Accent</label>
          <input type="color" id="accentColor" value="#f8fafc" onchange="updateColors()">
        </div>
      </div>
    </div>

    <div class="control-group">
      <h3>2. Vendor Info (Seller)</h3>
      <label>Vendor Name</label>
      <input type="text" id="vendorName" value="R. S. WATER CORPORATION" oninput="render()">
      <label>Address</label>
      <textarea id="vendorAddress" rows="2" oninput="render()">FRONT OF M. R. M. SCHOOL, LALBAGH, DARBHANGA&#10;Darbhanga - 846004</textarea>
      <label>GSTIN</label>
      <input type="text" id="vendorGst" value="10EVEPK8798G1Z8" oninput="render()">
    </div>

    <div class="control-group">
      <h3>3. Client Info (Customer)</h3>
      <label>Estimate For</label>
      <input type="text" id="clientName" value="TO THE PRINCIPAL" oninput="render()">
      <label>Client Details</label>
      <textarea id="clientAddress" rows="2" oninput="render()">MARWARI COLLEGE DARBHANGA&#10;Darbhanga - 846004</textarea>
    </div>

    <div class="control-group">
      <h3>4. Quotation Meta</h3>
      <label>Quotation Number</label>
      <input type="text" id="qNum" value="QT-001" oninput="render()">
      <label>Date</label>
      <input type="date" id="qDate" value="2026-08-22" oninput="render()">
      <label>Valid Until</label>
      <input type="date" id="qValid" value="2026-09-21" oninput="render()">
      <label>Currency</label>
      <input type="text" id="qCurrency" value="Indian Rupee (INR)" oninput="render()">
    </div>

    <div class="control-group">
      <h3>5. Item Management</h3>
      <div id="itemsContainer"></div>
      <button class="btn btn-add" onclick="addItem()">+ Add Item</button>
    </div>

    <div class="control-group">
      <h3>6. Terms & Footers</h3>
      <label>Notes</label>
      <input type="text" id="qNotes" value="Thanks for Doing Business with us" oninput="render()">
      <label>Terms & Conditions</label>
      <input type="text" id="qTerms" value="All taxes are inclusive" oninput="render()">
    </div>

    <button class="btn btn-print" onclick="window.print()">Print / Save as PDF</button>
  </div>

  <!-- Realtime A4 Preview Panel -->
  <div class="preview-panel">
    <div class="quotation-paper layout-corporate" id="paper">
      <div id="quotationRender"></div>
    </div>
  </div>
</div>

<script>
  let items = [
    { name: "USHA WATER COOLER 400 LTR.", qty: 1, unit: 1, rate: 139500 },
    { name: "KENT R.O ELITE (ii) 100 LPH.", qty: 1, unit: 1, rate: 95000 }
  ];

  function updateColors() {
    document.documentElement.style.setProperty('--primary', document.getElementById('primaryColor').value);
    document.documentElement.style.setProperty('--secondary', document.getElementById('secondaryColor').value);
    document.documentElement.style.setProperty('--accent', document.getElementById('accentColor').value);
  }

  function updateLayout() {
    const paper = document.getElementById('paper');
    paper.className = 'quotation-paper ' + document.getElementById('layoutSelect').value;
  }

  function renderItemsControl() {
    const container = document.getElementById('itemsContainer');
    container.innerHTML = '';
    items.forEach((item, index) => {
      container.innerHTML += `
        <div class="item-row">
          <input type="text" placeholder="Item Name" value="${item.name}" oninput="updateItem(${index}, 'name', this.value)">
          <input type="number" placeholder="Qty" style="width: 50px;" value="${item.qty}" oninput="updateItem(${index}, 'qty', this.value)">
          <input type="number" placeholder="Unit" style="width: 50px;" value="${item.unit}" oninput="updateItem(${index}, 'unit', this.value)">
          <input type="number" placeholder="Rate" style="width: 85px;" value="${item.rate}" oninput="updateItem(${index}, 'rate', this.value)">
          <button class="btn btn-remove" onclick="removeItem(${index})">X</button>
        </div>
      `;
    });
  }

  function addItem() {
    items.push({ name: "New Equipment / Service Item", qty: 1, unit: 1, rate: 0 });
    renderItemsControl();
    render();
  }

  function removeItem(index) {
    items.splice(index, 1);
    renderItemsControl();
    render();
  }

  function updateItem(index, key, value) {
    items[index][key] = key === 'name' ? value : parseFloat(value) || 0;
    render();
  }

  function formatCurrency(amt) {
    return amt.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function render() {
    const vName = document.getElementById('vendorName').value;
    const vAddr = document.getElementById('vendorAddress').value.replace(/\n/g, '<br>');
    const vGst = document.getElementById('vendorGst').value;

    const cName = document.getElementById('clientName').value;
    const cAddr = document.getElementById('clientAddress').value.replace(/\n/g, '<br>');

    const qNum = document.getElementById('qNum').value;
    const qDate = document.getElementById('qDate').value;
    const qValid = document.getElementById('qValid').value;
    const qCurr = document.getElementById('qCurrency').value;

    const qNotes = document.getElementById('qNotes').value;
    const qTerms = document.getElementById('qTerms').value;

    let itemsTableHtml = '';
    let subtotal = 0;

    items.forEach(item => {
      const amount = item.qty * item.rate;
      subtotal += amount;
      itemsTableHtml += `
        <tr>
          <td><strong>${item.name}</strong></td>
          <td style="text-align: center;">${item.qty}</td>
          <td style="text-align: center;">${item.unit}</td>
          <td style="text-align: right;">${formatCurrency(item.rate)}</td>
          <td style="text-align: right;"><strong>${formatCurrency(amount)}</strong></td>
        </tr>
      `;
    });

    const renderDiv = document.getElementById('quotationRender');
    renderDiv.innerHTML = `
      <div class="q-header">
        <div>
          <h1 style="color: var(--primary); font-size: 22px; font-weight: 700; margin-bottom: 4px;">${vName}</h1>
          <p style="color: #475569; font-size: 12px; line-height: 1.4;">${vAddr}</p>
          <p style="color: #475569; font-size: 12px; margin-top: 3px;"><strong>GSTIN:</strong> ${vGst}</p>
        </div>
        <div style="text-align: right;">
          <span class="badge q-title">QUOTATION</span>
          <div style="margin-top: 10px; font-size: 12px; line-height: 1.4; color: #334155;">
            <p><strong>Quotation #:</strong> ${qNum}</p>
            <p><strong>Date:</strong> ${qDate}</p>
            <p><strong>Valid Until:</strong> ${qValid}</p>
            <p><strong>Currency:</strong> ${qCurr}</p>
          </div>
        </div>
      </div>

      <div class="grid-2">
        <div class="info-box">
          <p style="text-transform: uppercase; color: #64748b; font-size: 10px; font-weight: 700; margin-bottom: 3px;">Estimate For:</p>
          <p><strong>${cName}</strong></p>
          <p style="color: #334155; margin-top: 2px;">${cAddr}</p>
        </div>
        <div class="info-box" style="display: flex; flex-direction: column; justify-content: center;">
          <p><strong>Status:</strong> Pending Approval</p>
          <p style="margin-top: 2px; color: #64748b;">Please review the items and terms below.</p>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>ITEM DESCRIPTION</th>
            <th style="text-align: center;">QTY</th>
            <th style="text-align: center;">UNIT</th>
            <th style="text-align: right;">RATE</th>
            <th style="text-align: right;">AMOUNT</th>
          </tr>
        </thead>
        <tbody>
          ${itemsTableHtml}
        </tbody>
      </table>

      <div class="totals-section">
        <table class="totals-table">
          <tr>
            <td>Subtotal</td>
            <td style="text-align: right;">${formatCurrency(subtotal)}</td>
          </tr>
          <tr class="grand-total">
            <td>Total</td>
            <td style="text-align: right;">${formatCurrency(subtotal)}</td>
          </tr>
        </table>
      </div>

      <div class="q-footer">
        <div>
          <p style="margin-bottom: 4px;"><strong>Notes:</strong> ${qNotes}</p>
          <p style="color: #64748b;"><strong>Terms & Conditions:</strong> ${qTerms}</p>
        </div>
        <div class="signature-container">
          <p style="font-size: 10px; color: #94a3b8; margin-bottom: 2px;">Quotation generated by</p>
          <p style="font-size: 11px; font-weight: 600;">R. S. WATER CORPORATION</p>
          <div class="signature-line">
            Authorised Signatory
          </div>
        </div>
      </div>
    `;
  }

  // Initial Load
  renderItemsControl();
  render();
</script>

</body>
</html>
