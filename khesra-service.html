<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Khesra Converter - Jameenseva.in</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --green: #28a745; --blue: #007bff; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 15px; margin: 0; }
        .card { max-width: 550px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); border-top: 5px solid var(--green); }
        h2 { text-align: center; color: var(--green); margin-bottom: 5px; font-size: 22px; }
        .section-title { background: #eee; padding: 5px 10px; font-size: 14px; font-weight: bold; margin: 20px 0 10px; border-radius: 4px; }
        label { display: block; margin: 10px 0 4px; font-size: 13px; font-weight: 600; color: #444; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; transition: 0.3s; }
        input:focus { border-color: var(--green); outline: none; box-shadow: 0 0 5px rgba(40,167,69,0.2); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .hidden-field { display: none; } /* Chhupane ke liye class */
        button { width: 100%; padding: 15px; background: var(--green); color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; margin-top: 25px; font-weight: bold; }
        #paymentArea { display: none; text-align: center; background: #f1f8e9; padding: 20px; border-radius: 10px; border: 1px dashed var(--green); }
    </style>
</head>
<body>

<div class="card">
    <h2>Bihar Survey Khesra Converter</h2>
    
    <div id="mainForm">
        <label>Aapko kya janna hai? (Select Type):</label>
        <select id="conv_type" onchange="toggleFields()" style="background: #e3f2fd; border-color: var(--blue); font-weight: bold;">
            <option value="old_to_new">Purana Khesra से Naya Khesra</option>
            <option value="new_to_old">Naya Khesra से Purana Khesra</option>
        </select>

        <div class="section-title">📍 Location Details</div>
        <div class="grid">
            <div>
                <label>Zila (District):</label>
                <select id="district" onchange="loadBlocks()">
                    <option value="">Zila Chunein</option>
                </select>
            </div>
            <div>
                <label>Anchal (Block):</label>
                <select id="block">
                    <option value="">Pehle Zila Chunein</option>
                </select>
            </div>
        </div>
        
        <div class="grid">
            <div><label>Mauja (Village):</label><input type="text" id="village"></div>
            <div><label>Thana No:</label><input type="text" id="thana_no"></div>
        </div>

        <div class="section-title">📄 Land Details</div>
        
        <div id="old_fields">
            <label>Purana Khesra (Plot No):</label>
            <input type="text" id="khesra_old" placeholder="Old Khesra bharein">
        </div>

        <div id="new_fields" class="hidden-field">
            <div class="grid">
                <div><label>Naya Khata:</label><input type="text" id="khata_new"></div>
                <div><label>Naya Khesra:</label><input type="text" id="khesra_new"></div>
            </div>
        </div>

        <label>Raiyat ka Naam (Owner):</label>
        <input type="text" id="raiyat_name">

        <div class="section-title">📲 Contact</div>
        <label>WhatsApp Number:</label>
        <input type="tel" id="mobile" placeholder="Mobile Number">

        <button onclick="goToPayment()">Details Verify Karein & Pay ₹29</button>
    </div>

    <div id="paymentArea">
        <h3 style="color: var(--green);">Sabhi Details Sahi Hain?</h3>
        <div id="review" style="text-align: left; font-size: 14px; margin-bottom: 15px; border-bottom: 1px solid #ccc; padding-bottom: 10px;"></div>
        <p>Service Charge: <b>₹29</b></p>
        
        <form>
            <script src="https://checkout.razorpay.com/v1/payment-button.js" 
                data-payment_button_id="pl_SdQsZaGPmkik6H" async> </script>
        </form>
        <button onclick="location.reload()" style="background:#888; margin-top:10px; padding:8px; font-size:12px;">Piche Jayein</button>
    </div>
</div>

    // District Dropdown bharne ke liye
    const distSelect = document.getElementById('district');
    for (let d in biharData) {
        distSelect.options[distSelect.options.length] = new Option(d, d);
    }

    function loadBlocks() {
        const blockSelect = document.getElementById('block');
        const selectedDist = distSelect.value;
        blockSelect.innerHTML = '<option value="">Block Chunein</option>';
        if(selectedDist) {
            biharData[selectedDist].forEach(b => {
                blockSelect.options[blockSelect.options.length] = new Option(b, b);
            });
        }
    }

    // Dynamic Hide/Show Logic
    function toggleFields() {
        const type = document.getElementById('conv_type').value;
        const oldFields = document.getElementById('old_fields');
        const newFields = document.getElementById('new_fields');

        if(type === 'old_to_new') {
            oldFields.style.display = 'block';
            newFields.style.display = 'none';
        } else {
            oldFields.style.display = 'none';
            newFields.style.display = 'block';
        }
    }

    function goToPayment() {
        const data = {
            district: document.getElementById('district').value,
            block: document.getElementById('block').value,
            village: document.getElementById('village').value,
            thana_no: document.getElementById('thana_no').value,
            khesra_old: document.getElementById('khesra_old').value,
            khata_new: document.getElementById('khata_new').value,
            khesra_new: document.getElementById('khesra_new').value,
            raiyat_name: document.getElementById('raiyat_name').value,
            mobile: document.getElementById('mobile').value,
            status: 'Pending',
            order_date: new Date().toLocaleDateString()
        };

        if(!data.district || !data.mobile) { alert("Zila aur Mobile Number zaruri hai!"); return; }

        localStorage.setItem('temp_order', JSON.stringify(data));
        
        document.getElementById('review').innerHTML = `
            <b>Zila:</b> ${data.district} | <b>Block:</b> ${data.block}<br>
            <b>Village:</b> ${data.village}<br>
            ${data.khesra_old ? '<b>Purana Khesra:</b> '+data.khesra_old : '<b>Naya Khesra:</b> '+data.khesra_new}<br>
            <b>WhatsApp:</b> ${data.mobile}
        `;

        document.getElementById('mainForm').style.display = 'none';
        document.getElementById('paymentArea').style.display = 'block';
    }
</script>
</body>
</html>
