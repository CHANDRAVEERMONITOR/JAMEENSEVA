<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khesra Converter Online - Jameenseva.in</title>
    <style>
        :root { --primary: #28a745; --secondary: #007bff; --light: #f8f9fa; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: var(--primary); margin-bottom: 10px; }
        .badge { display: block; text-align: center; background: #fff3cd; color: #856404; padding: 5px; border-radius: 5px; font-size: 14px; margin-bottom: 20px; border: 1px solid #ffeeba; }
        
        .option-box { margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; background: var(--light); }
        label { font-weight: bold; display: block; margin-bottom: 8px; }
        select, input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        
        .payment-section { text-align: center; border-top: 2px dashed #ddd; padding-top: 20px; margin-top: 20px; }
        .status-btn { display: block; text-align: center; margin-top: 15px; color: var(--secondary); text-decoration: none; font-weight: bold; }
        
        .trust-icons { display: flex; justify-content: space-around; margin-top: 20px; font-size: 12px; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h2>Khesra Converter (Online)</h2>
    <span class="badge">Bihar Survey 2026 Special Service</span>

    <div class="option-box">
        <label>Seva Chunein (Select Service):</label>
        <select id="conversionType">
            <option value="old_to_new">Purana Khesra se Naya Khesra</option>
            <option value="new_to_old">Naya Khesra se Purana Khesra</option>
        </select>

        <label>Zila (District):</label>
        <input type="text" placeholder="Zila ka naam likhein" id="dist">

        <label>Mauja/Gaon ka naam:</label>
        <input type="text" placeholder="Gaon ka naam likhein" id="village">

        <label>Khesra Number (Plot No):</label>
        <input type="text" placeholder="Khesra number bharein" id="khesra_no">

        <label>WhatsApp Number (Details paane ke liye):</label>
        <input type="tel" placeholder="Mobile Number" id="mobile_no">
    </div>

    <div class="payment-section">
        <p style="font-weight: bold;">Seva Sulk: ₹29 (Single Request)</p>
        
        <form>
            <script src="https://checkout.razorpay.com/v1/payment-button.js" 
                    data-payment_button_id="pl_SdQsZaGPmkik6H" async> 
            </script> 
        </form>
        
        <p style="font-size: 12px; color: #888; margin-top: 10px;">Payment ke baad details 2 ghante mein WhatsApp par bhej di jayegi.</p>
    </div>

    <a href="track.html" class="status-btn">Track Order / Check Status</a>

    <div class="trust-icons">
        <span>✅ Safe Payment</span>
        <span>✅ Official Records</span>
        <span>✅ WhatsApp Support</span>
    </div>
</div>

</body>
</html>
