<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Land Calculator | JameenSeva</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
            --text-main: #f8fafc;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .main-card {
            max-width: 650px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }

        .top-banner {
            background: linear-gradient(135deg, #059669 0%, #065f46 100%);
            padding: 25px;
            text-align: center;
            border-bottom: 4px solid var(--accent-orange);
        }

        .top-banner h1 { margin: 0; font-size: 30px; text-transform: uppercase; letter-spacing: 2px; }

        .content { padding: 25px; }

        .settings-grid {
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            border: 1px dashed #475569;
        }

        .input-wrapper { margin-bottom: 20px; }

        label { display: block; margin-bottom: 8px; font-weight: bold; color: #94a3b8; font-size: 14px; }

        select, input {
            width: 100%;
            padding: 14px;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus { border-color: var(--accent-green); outline: none; box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }

        /* Results Cards */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 10px;
        }

        .res-item {
            background: linear-gradient(145deg, #1e293b, #111827);
            padding: 15px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid #334155;
        }

        .res-item span { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; text-transform: uppercase; }
        .res-item strong { font-size: 22px; color: var(--accent-green); }
        .res-item.highlight strong { color: var(--accent-orange); }

        .paimana-box {
            margin-top: 25px;
            font-size: 12px;
            background: rgba(245, 158, 11, 0.1);
            padding: 15px;
            border-radius: 12px;
            color: #fbbf24;
            line-height: 1.6;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        @media (max-width: 480px) {
            .results-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="main-card">
    <div class="top-banner">
        <h1>जमीन कैलकुलेटर प्रो</h1>
        <div style="font-size: 14px; margin-top: 5px;">बिहार विशेष सर्वे 2026 हेतु सटीक गणना</div>
    </div>

    <div class="content">
        <div class="settings-grid">
            <label>📏 अपने क्षेत्र की लग्गी चुनें (हाथ):</label>
            <select id="laggi" onchange="calculate('dismil')">
                <option value="4">4 हाथ</option>
                <option value="4.5">4.5 हाथ</option>
                <option value="5">5 हाथ</option>
                <option value="5.5" selected>5.5 हाथ</option>
                <option value="6">6 हाथ</option>
                <option value="6.5">6.5 हाथ</option>
                <option value="7">7 हाथ</option>
                <option value="7.5">7.5 हाथ</option>
                <option value="8">8 हाथ</option>
                <option value="8.25">8.25 हाथ</option>
                <option value="9">9 हाथ</option>
                <option value="10">10 हाथ</option>
                <option value="12">12 हाथ</option>
            </select>
        </div>

        <div class="input-wrapper">
            <label>डिसमिल (Dismil) दर्ज करें:</label>
            <input type="number" id="dismil" placeholder="यहाँ डिसमिल लिखें..." oninput="calculate('dismil')">
        </div>

        <div class="results-grid">
            <div class="res-item highlight"><span>धूर (Dhur)</span><strong id="outDhur">0</strong></div>
            <div class="res-item highlight"><span>कट्ठा (Kattha)</span><strong id="outKattha">0</strong></div>
            <div class="res-item"><span>बीघा (Bigha)</span><strong id="outBigha">0</strong></div>
            <div class="res-item"><span>स्क्वायर फीट (Sq.Ft)</span><strong id="outSqft">0</strong></div>
            <div class="res-item"><span>स्क्वायर कड़ी</span><strong id="outKari">0</strong></div>
            <div class="res-item"><span>स्क्वायर गज</span><strong id="outGaj">0</strong></div>
            <div class="res-item"><span>स्क्वायर मीटर</span><strong id="outMeter">0</strong></div>
            <div class="res-item"><span>एकड़ (Acre)</span><strong id="outAcre">0</strong></div>
        </div>

        <div class="paimana-box">
            <b>सटीक फार्मूला:</b> धूर = (डिसमिल × 193.6) ÷ लग्गी² <br>
            <b>पैमाना:</b> 1 डिसमिल = 435.6 SqFt | 1000 Sq Kari | 48.4 Sq Gaj | 40.47 Sq Meter
        </div>
    </div>
</div>

<script>
function calculate(source) {
    let laggi = parseFloat(document.getElementById('laggi').value);
    let dismil = parseFloat(document.getElementById('dismil').value);

    if (isNaN(dismil) || dismil <= 0) {
        resetValues();
        return;
    }

    // आपका फार्मूला: Dhur = (dismil * 968/5) / (laggi * laggi)
    // 968/5 = 193.6
    let dhur = (dismil * 193.6) / (laggi * laggi);
    
    let kattha = dhur / 20;
    let bigha = kattha / 20;

    // अन्य पैमानों की गणना
    let sqft = dismil * 435.6;
    let kari = dismil * 1000;
    let gaj = dismil * 48.4;
    let meter = dismil * 40.47;
    let acre = dismil / 100;

    // आउटपुट दिखाना
    document.getElementById('outDhur').innerText = dhur.toFixed(2);
    document.getElementById('outKattha').innerText = kattha.toFixed(2);
    document.getElementById('outBigha').innerText = bigha.toFixed(2);
    document.getElementById('outSqft').innerText = sqft.toLocaleString();
    document.getElementById('outKari').innerText = kari.toLocaleString();
    document.getElementById('outGaj').innerText = gaj.toFixed(2);
    document.getElementById('outMeter').innerText = meter.toFixed(2);
    document.getElementById('outAcre').innerText = acre.toFixed(3);
}

function resetValues() {
    const ids = ['outDhur', 'outKattha', 'outBigha', 'outSqft', 'outKari', 'outGaj', 'outMeter', 'outAcre'];
    ids.forEach(id => document.getElementById(id).innerText = '0');
}
</script>

</body>
</html>
