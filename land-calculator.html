<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Bihar Land Calculator | JameenSeva</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1b5e20; /* गहरा हरा - बिहार राजस्व रंग */
            --accent: #d4af37;  /* गोल्ड - प्रीमियम लुक */
            --bg: #fdfdfd;
        }

        body { font-family: 'Roboto', sans-serif; background: #e0e0e0; padding: 10px; }

        .main-container {
            max-width: 650px;
            margin: 20px auto;
            background: var(--bg);
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            border: 2px solid var(--accent);
            overflow: hidden;
        }

        .head-section {
            background: var(--primary);
            color: white;
            padding: 25px;
            text-align: center;
            border-bottom: 5px solid var(--accent);
        }

        .head-section h1 { margin: 0; font-size: 24px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }

        .calculator-body { padding: 25px; }

        .lagga-selector {
            background: #fff9c4;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px dashed #fbc02d;
            text-align: center;
        }

        .lagga-selector label { font-weight: bold; color: var(--primary); font-size: 18px; display: block; margin-bottom: 10px; }

        select {
            width: 80%;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid var(--primary);
            border-radius: 8px;
            background: white;
            cursor: pointer;
        }

        .input-box-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .box { background: #fff; padding: 15px; border: 1px solid #ddd; border-radius: 10px; transition: 0.3s; }
        .box:focus-within { border-color: var(--accent); box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }

        .box label { font-size: 13px; font-weight: bold; color: #555; display: block; margin-bottom: 5px; }
        
        .box input {
            width: 100%;
            border: none;
            font-size: 22px;
            font-weight: bold;
            color: var(--primary);
            outline: none;
            background: transparent;
        }

        .full-width { grid-column: 1 / -1; background: #e8f5e9; border: 2px solid var(--primary); }

        .other-results {
            margin-top: 25px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .mini-card { background: #f1f8e9; padding: 10px; text-align: center; border-radius: 8px; border: 1px solid #c8e6c9; }
        .mini-card span { font-size: 11px; color: #666; display: block; }
        .mini-card b { font-size: 14px; color: #1b5e20; }

        .formula-card {
            margin-top: 25px;
            background: #fafafa;
            border-top: 1px solid #eee;
            padding: 15px;
            font-size: 12px;
            color: #777;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="head-section">
        <h1>डिजिटल जमीन मापी कैलकुलेटर</h1>
        <div style="font-size: 12px; margin-top: 5px;">बिहार विशेष सर्वे 2026 मानक पर आधारित</div>
    </div>

    <div class="calculator-body">
        
        <div class="lagga-selector">
            <label>📏 अपना लग्गा चुनें (हाथ में):</label>
            <select id="laggi" onchange="calculate('sqft')">
                <option value="4">4 हाथ</option>
                <option value="4.5">4.5 हाथ</option>
                <option value="5">5 हाथ</option>
                <option value="5.5" selected>5.5 हाथ</option>
                <option value="6">6 हाथ</option>
                <option value="6.5">6.5 हाथ</option>
                <option value="7">7 हाथ</option>
                <option value="7.5">7.5 हाथ</option>
                <option value="8.25">8.25 हाथ (राजस्व मानक)</option>
            </select>
        </div>

        <div class="input-box-grid">
            <div class="box full-width">
                <label>डिसमिल (Dismil)</label>
                <input type="number" id="id_dismil" oninput="calculate('dismil')" placeholder="0">
            </div>
            
            <div class="box">
                <label>धूर (Dhur)</label>
                <input type="number" id="id_dhur" oninput="calculate('dhur')" placeholder="0">
            </div>

            <div class="box">
                <label>कट्ठा (Kattha)</label>
                <input type="number" id="id_kattha" oninput="calculate('kattha')" placeholder="0">
            </div>

            <div class="box">
                <label>बीघा (Bigha)</label>
                <input type="number" id="id_bigha" oninput="calculate('bigha')" placeholder="0">
            </div>

            <div class="box">
                <label>वर्ग फीट (Sq. Ft)</label>
                <input type="number" id="id_sqft" oninput="calculate('sqft')" placeholder="0">
            </div>
        </div>

        <div class="other-results">
            <div class="mini-card"><span>वर्ग कड़ी</span><b id="res_kari">0</b></div>
            <div class="mini-card"><span>वर्ग गज</span><b id="res_gaj">0</b></div>
            <div class="mini-card"><span>वर्ग मीटर</span><b id="res_meter">0</b></div>
            <div class="mini-card"><span>एकड़</span><b id="res_acre">0</b></div>
            <div class="mini-card"><span>बिता (9")</span><b id="res_bitta">0</b></div>
            <div class="mini-card"><span>धुरकी</span><b id="res_dhurki">0</b></div>
        </div>

        <div class="formula-card">
            <b>सूत्र:</b> धूर = (डिसमिल × 193.6) ÷ लग्गा² | 20 धूर = 1 कट्ठा | 20 कट्ठा = 1 बीघा
        </div>
    </div>
</div>

<script>
function calculate(source) {
    let laggi = parseFloat(document.getElementById('laggi').value);
    let val = parseFloat(document.getElementById('id_' + source).value);
    
    if (isNaN(val) || val < 0) { clearAll(source); return; }

    let sqft = 0;
    let oneDhurSqft = (laggi * 1.5) ** 2; // लग्गी आधारित 1 धूर का मान फीट में

    // 1. सबसे पहले सबको Square Feet में बदलो (आधार)
    if (source === 'dismil') sqft = val * 435.6;
    else if (source === 'sqft') sqft = val;
    else if (source === 'dhur') sqft = val * oneDhurSqft;
    else if (source === 'kattha') sqft = val * 20 * oneDhurSqft;
    else if (source === 'bigha') sqft = val * 400 * oneDhurSqft;

    // 2. अब Square Feet से बाकी सारी वैल्यूज भरें
    if (source !== 'dismil') document.getElementById('id_dismil').value = (sqft / 435.6).toFixed(3);
    if (source !== 'sqft') document.getElementById('id_sqft').value = sqft.toFixed(2);
    
    let totalDhur = sqft / oneDhurSqft;
    if (source !== 'dhur') document.getElementById('id_dhur').value = totalDhur.toFixed(2);
    if (source !== 'kattha') document.getElementById('id_kattha').value = (totalDhur / 20).toFixed(2);
    if (source !== 'bigha') document.getElementById('id_bigha').value = (totalDhur / 400).toFixed(3);

    // 3. एक्स्ट्रा डेटा
    document.getElementById('res_kari').innerText = Math.round((sqft / 435.6) * 1000);
    document.getElementById('res_gaj').innerText = (sqft / 9).toFixed(2);
    document.getElementById('res_meter').innerText = (sqft / 10.764).toFixed(2);
    document.getElementById('res_acre').innerText = (sqft / 43560).toFixed(4);
    document.getElementById('res_bitta').innerText = (sqft / 0.5625).toFixed(0); // 1 बिता = 9 इंच = 0.75 फीट -> 0.75^2 = 0.5625
    document.getElementById('res_dhurki').innerText = (totalDhur * 20).toFixed(0);
}

function clearAll(source) {
    const fields = ['id_dismil', 'id_dhur', 'id_kattha', 'id_bigha', 'id_sqft'];
    fields.forEach(f => { if(f !== 'id_'+source) document.getElementById(f).value = ''; });
}
</script>

</body>
</html>
