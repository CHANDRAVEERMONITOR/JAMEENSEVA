<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JameenSeva - Professional Land Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #0b2e13; /* Dark Green */
            --accent-gold: #c5a021; /* Gold */
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 15px;
        }

        .master-card {
            max-width: 700px;
            margin: 20px auto;
            background: #fff;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            overflow: hidden;
            border: 2px solid var(--accent-gold);
        }

        .header-top {
            background: linear-gradient(135deg, var(--primary-bg), #1e5128);
            color: #fff;
            padding: 35px 20px;
            text-align: center;
            border-bottom: 6px solid var(--accent-gold);
        }

        .header-top h1 { margin: 0; font-size: 28px; text-transform: uppercase; letter-spacing: 1.5px; }

        .content-area { padding: 30px; }

        .lagga-box {
            background: #fff9e1;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            border: 1px solid #ffe082;
            text-align: center;
        }

        .lagga-box label { font-weight: 700; color: var(--primary-bg); font-size: 18px; display: block; margin-bottom: 12px; }

        select {
            width: 90%;
            padding: 15px;
            font-size: 18px;
            font-weight: 700;
            border: 3px solid var(--primary-bg);
            border-radius: 10px;
            background: #fff;
            color: var(--primary-bg);
            cursor: pointer;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .field { background: #f8fafc; padding: 15px; border-radius: 12px; border: 2px solid #e2e8f0; }
        .field:focus-within { border-color: var(--accent-gold); background: #fff; }
        .field label { font-size: 13px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 8px; display: block; }
        .field input { width: 100%; border: none; outline: none; font-size: 22px; font-weight: 700; color: var(--primary-bg); background: transparent; }

        .full { grid-column: 1 / -1; border: 2px solid var(--primary-bg); background: #f0fff4; }

        .result-stats {
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .mini-stat { background: #f1f5f9; padding: 15px; border-radius: 10px; border-left: 5px solid var(--accent-gold); }
        .mini-stat span { font-size: 12px; color: #64748b; font-weight: 600; }
        .mini-stat b { font-size: 18px; color: #0f172a; display: block; }

        .action-btns {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }

        .btn {
            flex: 1;
            padding: 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            border: none;
            transition: 0.3s;
        }

        .btn-p { background: var(--primary-bg); color: #fff; }
        .btn-s { background: var(--accent-gold); color: #000; }
        .btn:hover { transform: translateY(-3px); opacity: 0.9; }

        .footer-info {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

<div class="master-card" id="mainCalc">
    <div class="header-top">
        <h1>Advanced Land Expert</h1>
        <div style="font-size: 13px; opacity: 0.8; margin-top: 5px;">बिहार विशेष सर्वेक्षण - डिजिटल कैलकुलेटर 2026</div>
    </div>

    <div class="content-area">
        <div class="lagga-box">
            <label>📏 लग्गा का चुनाव करें (हाथ):</label>
            <select id="laggi" onchange="performCalc('sqft')">
                <option value="4">4 हाथ</option>
                <option value="4.5">4.5 हाथ</option>
                <option value="5">5 हाथ</option>
                <option value="5.5" selected>5.5 हाथ</option>
                <option value="6">6 हाथ</option>
                <option value="6.5">6.5 हाथ</option>
                <option value="7">7 हाथ</option>
                <option value="7.5">7.5 हाथ</option>
                <option value="8">8 हाथ</option>
                <option value="8.25">8.25 हाथ (राजस्व)</option>
                <option value="8.5">8.5 हाथ</option>
            </select>
        </div>

        <div class="grid-inputs">
            <div class="field full">
                <label>डिसमिल (Dismil)</label>
                <input type="number" id="in_dismil" oninput="performCalc('dismil')" placeholder="0">
            </div>
            <div class="field">
                <label>बीघा (Bigha)</label>
                <input type="number" id="in_bigha" oninput="performCalc('bigha')" placeholder="0">
            </div>
            <div class="field">
                <label>कट्ठा (Kattha)</label>
                <input type="number" id="in_kattha" oninput="performCalc('kattha')" placeholder="0">
            </div>
            <div class="field">
                <label>धूर (Dhur)</label>
                <input type="number" id="in_dhur" oninput="performCalc('dhur')" placeholder="0">
            </div>
            <div class="field">
                <label>वर्ग फीट (Sq. Ft)</label>
                <input type="number" id="in_sqft" oninput="performCalc('sqft')" placeholder="0">
            </div>
        </div>

        <div class="result-stats">
            <div class="mini-stat"><span>एकड़ (Acre)</span><b id="res_acre">0</b></div>
            <div class="mini-stat"><span>वर्ग कड़ी (Sq. Kari)</span><b id="res_kari">0</b></div>
            <div class="mini-stat"><span>वर्ग मीटर (Sq. Meter)</span><b id="res_meter">0</b></div>
            <div class="mini-stat"><span>वर्ग गज (Sq. Yard)</span><b id="res_gaj">0</b></div>
        </div>

        <div class="action-btns">
            <button class="btn btn-p" onclick="window.print()">📥 PDF रिपोर्ट</button>
            <button class="btn btn-s" onclick="copyToClip()">📋 हिसाब कॉपी करें</button>
        </div>
    </div>

    <div class="footer-info">
        * सूत्र: 1 हाथ = 18 इंच | 1 डिसमिल = 435.6 sq.ft | 20 धूर = 1 कट्ठा<br>
        © JameenSeva.in - आपकी जमीन का डिजिटल साथी
    </div>
</div>

<script>
function performCalc(source) {
    let laggi = parseFloat(document.getElementById('laggi').value);
    let val = parseFloat(document.getElementById('in_' + source).value);
    
    if (isNaN(val) || val < 0) { clearFields(source); return; }

    let sqft = 0;
    // 1 Dhur Sqft = (Laggi * 1.5) ^ 2
    let oneDhurSqft = (laggi * 1.5) ** 2;

    // Convert everything to Sqft base
    if (source === 'dismil') sqft = val * 435.6;
    else if (source === 'sqft') sqft = val;
    else if (source === 'dhur') sqft = val * oneDhurSqft;
    else if (source === 'kattha') sqft = val * 20 * oneDhurSqft;
    else if (source === 'bigha') sqft = val * 400 * oneDhurSqft;

    // Fill all inputs
    if (source !== 'dismil') document.getElementById('in_dismil').value = (sqft / 435.6).toFixed(3);
    if (source !== 'sqft') document.getElementById('in_sqft').value = sqft.toFixed(2);
    
    let totalDhur = sqft / oneDhurSqft;
    if (source !== 'dhur') document.getElementById('in_dhur').value = totalDhur.toFixed(2);
    if (source !== 'kattha') document.getElementById('in_kattha').value = (totalDhur / 20).toFixed(2);
    if (source !== 'bigha') document.getElementById('in_bigha').value = (totalDhur / 400).toFixed(3);

    // Other Units
    document.getElementById('res_acre').innerText = (sqft / 43560).toFixed(4);
    document.getElementById('res_kari').innerText = Math.round((sqft / 435.6) * 1000);
    document.getElementById('res_meter').innerText = (sqft / 10.764).toFixed(2);
    document.getElementById('res_gaj').innerText = (sqft / 9).toFixed(2);
}

function clearFields(source) {
    const ids = ['in_dismil', 'in_sqft', 'in_dhur', 'in_kattha', 'in_bigha'];
    ids.forEach(id => { if(id !== 'in_'+source) document.getElementById(id).value = ''; });
}

function copyToClip() {
    let d = document.getElementById('in_dismil').value;
    let b = document.getElementById('in_bigha').value;
    let k = document.getElementById('in_kattha').value;
    let dh = document.getElementById('in_dhur').value;
    let l = document.getElementById('laggi').value;
    
    let text = `--- जमीन मापी रिपोर्ट (JameenSeva) ---\n`;
    text += `लग्गी: ${l} हाथ\nडिसमिल: ${d}\nहिसाब: ${b} बीघा, ${k} कट्ठा, ${dh} धूर\nवेबसाइट: JameenSeva.in`;
    
    navigator.clipboard.writeText(text);
    alert("हिसाब कॉपी हो गया! अब WhatsApp पर भेजें।");
}
</script>

</body>
</html>
