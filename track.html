<script>
// Supabase Setup
const supabaseUrl = 'https://efgvsddclcnbmwqbtily.supabase.co';
const supabaseKey = 'sb_publishable_9w-thNkNGT410q9-xfqISQ_sH2Uzmv5';
const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

async function trackOrder() {
    const input = document.getElementById("track-input").value.trim();
    const detailsBox = document.getElementById("order-details");
    const loader = document.getElementById("loader");

    if (!input) { alert("कृपया ID या मोबाइल नंबर भरें!"); return; }

    loader.style.display = "block";
    detailsBox.style.display = "none";

    try {
        // 1. Pehle 'khatiyan order' table mein check karein
        let { data: khatiyanData, error: kError } = await _supabase
            .from('khatiyan order')
            .select('*')
            .or(`order_id.eq.${input},mobile.eq.${input}`)
            .limit(1);

        let order = null;
        let isPanchnama = false;

        if (khatiyanData && khatiyanData.length > 0) {
            order = khatiyanData[0];
        } else {
            // 2. Agar khatiyan mein nahi mila, toh 'panchnama batwara' mein check karein
            let { data: panchnamaData, error: pError } = await _supabase
                .from('panchnama batwara')
                .select('*')
                .or(`order_id.eq.${input},mobile.eq.${input}`)
                .limit(1);

            if (panchnamaData && panchnamaData.length > 0) {
                order = panchnamaData[0];
                isPanchnama = true;
            }
        }

        loader.style.display = "none";

        if (!order) {
            alert("माफ़ी चाहते हैं, कोई रिकॉर्ड नहीं मिला। कृपया सही ID या मोबाइल नंबर डालें।");
            return;
        }

        // --- Data Filling Logic ---
        document.getElementById("res-id").innerText = order.order_id;
        document.getElementById("res-name").innerText = order.raiyat_name || "N/A";
        document.getElementById("res-mobile").innerText = order.mobile;
        document.getElementById("res-address").innerText = order.full_address;
        document.getElementById("res-pincode").innerText = order.pincode;
        document.getElementById("res-dist").innerText = order.district;
        document.getElementById("res-block").innerText = order.block;
        document.getElementById("res-village").innerText = order.village;

        // Agar Panchnama hai toh Khata/Khesra ki jagah Thana No dikhayein
        if (isPanchnama) {
            document.getElementById("res-khata").innerHTML = `<b>थाना नंबर:</b> ${order.thana_no || "N/A"}`;
            document.getElementById("res-khesra").innerText = "पंचनामा बटवारा";
            document.getElementById("res-type").innerText = "Panchnama Service";
        } else {
            document.getElementById("res-khata").innerText = order.khata_no || "N/A";
            document.getElementById("res-khesra").innerText = order.khesra_no || "N/A";
            document.getElementById("res-type").innerText = order.khatiyan_type || "Khatiyan Service";
        }
        
        // Status Badge Logic
        const statusTag = document.getElementById("status-tag");
        const currentStatus = order.status || "Order Received";
        statusTag.innerText = currentStatus;

        if(currentStatus === "Delivered") statusTag.style.background = "#28a745";
        else if(currentStatus === "Processing") statusTag.style.background = "#ffc107";
        else statusTag.style.background = "#d9534f";

        detailsBox.style.display = "block";

    } catch (err) {
        loader.style.display = "none";
        alert("कुछ तकनीकी समस्या आई है: " + err.message);
    }
}
</script>
