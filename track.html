<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ऑर्डर ट्रैक करें - JameenSeva.in</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 15px; }
        .container { max-width: 600px; margin: auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #005689; text-align: center; margin-bottom: 25px; }
        .search-box { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; background: #eef2f3; padding: 15px; border-radius: 10px; }
        input { padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        button { padding: 12px; background: #005689; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
        button:hover { background: #003d61; }
        
        /* Details Section */
        #order-details { display: none; margin-top: 20px; border-top: 2px solid #eee; padding-top: 20px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .info-item { background: #f9f9f9; padding: 10px; border-radius: 5px; border: 1px solid #eee; }
        .label { font-size: 12px; color: #666; font-weight: bold; }
        .value { font-size: 15px; color: #333; margin-top: 5px; }

        /* Status Timeline */
        .status-tracker { display: flex; justify-content: space-between; margin: 30px 0; position: relative; }
        .status-step { text-align: center; z-index: 1; flex: 1; }
        .status-dot { width: 25px; height: 25px; background: #ccc; border-radius: 50%; margin: 0 auto 5px; border: 3px solid #fff; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
        .status-label { font-size: 11px; font-weight: bold; color: #888; }
        .status-step.active .status-dot { background: #28a745; }
        .status-step.active .status-label { color: #28a745; }
        .progress-line { position: absolute; top: 12px; left: 10%; right: 10%; height: 3px; background: #ccc; z-index: 0; }
        .navbar { background: #28a745; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
        .navbar a { color: white; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="navbar"><a href="index.html">🏠 होम पेज पर वापस जाएं</a></div>

<div class="container">
    <h2>🚚 अपना ऑर्डर ट्रैक करें</h2>
    
    <div class="search-box">
        <label>ट्रैकिंग ID (उदा. JS-1234):</label>
        <input type="text" id="track-id" placeholder="JS-XXXX">
        <p style="text-align: center; margin: 0; font-weight: bold;">या</p>
        <label>रजिस्टर्ड मोबाइल नंबर:</label>
        <input type="tel" id="track-mobile" placeholder="10 अंकों का मोबाइल नंबर" maxlength="10">
        <button onclick="trackOrder()">ऑर्डर की जानकारी देखें</button>
    </div>

    <div id="loader" style="display:none; text-align:center;">डेटा खोजा जा रहा है...</div>

    <div id="order-details">
        <h3 style="color: #28a745; text-align: center;">ऑर्डर मिल गया!</h3>
        
        <div class="status-tracker">
            <div class="progress-line" id="progress-bar"></div>
            <div class="status-step" id="step-received"><div class="status-dot"></div><div class="status-label">प्राप्त हुआ</div></div>
            <div class="status-step" id="step-processing"><div class="status-dot"></div><div class="status-label">काम जारी</div></div>
            <div class="status-step" id="step-dispatched"><div class="status-dot"></div><div class="status-label">भेज दिया</div></div>
            <div class="status-step" id="step-delivered"><div class="status-dot"></div><div class="status-label">पहुँच गया</div></div>
        </div>

        <div class="info-grid">
            <div class="info-item"><div class="label">ऑर्डर ID</div><div class="value" id="res-id"></div></div>
            <div class="info-item"><div class="label">ऑर्डर की तारीख</div><div class="value" id="res-date"></div></div>
            <div class="info-item"><div class="label">जिला</div><div class="value" id="res-dist"></div></div>
            <div class="info-item"><div class="label">ब्लॉक</div><div class="value" id="res-block"></div></div>
            <div class="info-item"><div class="label">गाँव/मौज</div><div class="value" id="res-village"></div></div>
            <div class="info-item"><div class="label">खतियान प्रकार</div><div class="value" id="res-type"></div></div>
            <div class="info-item" style="grid-column: span 2;"><div class="label">वर्तमान स्थिति (Status)</div><div class="value" style="color:#d9534f; font-weight:bold;" id="res-status"></div></div>
        </div>
        
        <p class="note" style="text-align: center; font-size: 13px; color: #555;">किसी भी सहायता के लिए हमें <b>nainasighchauhan@email.com</b> पर मेल करें।</p>
    </div>
</div>

<script>
// Supabase Connection
const supabaseUrl = 'https://efgvsddclcnbmwqbtily.supabase.co';
const supabaseKey = 'sb_publishable_9w-thNkNGT410q9-xfqISQ_sH2Uzmv5';
const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

async function trackOrder() {
    const trackID = document.getElementById("track-id").value.trim();
    const mobile = document.getElementById("track-mobile").value.trim();
    const detailsBox = document.getElementById("order-details");
    const loader = document.getElementById("loader");

    if (!trackID && !mobile) {
        alert("कृपया ट्रैकिंग ID या मोबाइल नंबर भरें!");
        return;
    }

    loader.style.display = "block";
    detailsBox.style.display = "none";

    let query = _supabase.from('khatiyan order').select('*');

    if (trackID) {
        query = query.eq('order_id', trackID);
    } else {
        query = query.eq('mobile', mobile);
    }

    const { data, error } = await query;

    loader.style.display = "none";

    if (error || !data || data.length === 0) {
        alert("कोई ऑर्डर नहीं मिला। कृपया सही जानकारी भरें।");
        return;
    }

    const order = data[0]; // Latest order fetch
    
    // UI mein data bharna
    document.getElementById("res-id").innerText = order.order_id;
    document.getElementById("res-date").innerText = order.order_date;
    document.getElementById("res-dist").innerText = order.district;
    document.getElementById("res-block").innerText = order.block;
    document.getElementById("res-village").innerText = order.village;
    document.getElementById("res-type").innerText = order.khatiyan_type;
    document.getElementById("res-status").innerText = order.status || "Order Received";

    updateTimeline(order.status);
    detailsBox.style.display = "block";
}

function updateTimeline(status) {
    // Reset classes
    document.querySelectorAll('.status-step').forEach(s => s.classList.remove('active'));
    const bar = document.getElementById("progress-bar");
    
    const s = status ? status.toLowerCase() : "";

    document.getElementById("step-received").classList.add('active');
    bar.style.background = "linear-gradient(to right, #28a745 0%, #ccc 0%)";

    if (s.includes('process') || s.includes('working')) {
        document.getElementById("step-processing").classList.add('active');
        bar.style.background = "linear-gradient(to right, #28a745 33%, #ccc 33%)";
    } else if (s.includes('dispatch') || s.includes('sent')) {
        document.getElementById("step-processing").classList.add('active');
        document.getElementById("step-dispatched").classList.add('active');
        bar.style.background = "linear-gradient(to right, #28a745 66%, #ccc 66%)";
    } else if (s.includes('deliver')) {
        document.getElementById("step-processing").classList.add('active');
        document.getElementById("step-dispatched").classList.add('active');
        document.getElementById("step-delivered").classList.add('active');
        bar.style.background = "#28a745";
    }
}
</script>

</body>
</html>
