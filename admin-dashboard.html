<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JameenSeva Admin Master Panel</title>
  
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'Noto Sans Devanagari', Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      line-height: 1.5;
    }

    /* Top Control Bar */
    .top-bar {
      background: #ffffff;
      padding: 14px 20px;
      border-bottom: 1.5px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-title span { color: #16a34a; }

    .control-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .search-inp {
      padding: 9px 14px;
      border: 1.8px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      width: 260px;
      outline: none;
      transition: 0.2s;
    }
    .search-inp:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }

    .filter-select {
      padding: 9px 12px;
      border: 1.8px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      outline: none;
      background: #fff;
      cursor: pointer;
    }

    .btn {
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-green { background: #16a34a; color: #fff; }
    .btn-green:hover { background: #15803d; }
    .btn-refresh { background: #f1f5f9; color: #0f172a; border: 1.5px solid #cbd5e1; }
    .btn-refresh:hover { background: #e2e8f0; }

    /* Main Table Container */
    .table-card {
      margin: 18px 20px;
      background: #fff;
      border-radius: 12px;
      border: 1.5px solid #e2e8f0;
      box-shadow: 0 4px 16px rgba(15,23,42,0.05);
      overflow: hidden;
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed; /* Ensures strict column widths so dates never cut */
      font-size: 13.5px;
    }

    th {
      background: #f8fafc;
      color: #475569;
      font-weight: 700;
      padding: 12px 14px;
      text-align: left;
      border-bottom: 2px solid #e2e8f0;
      white-space: nowrap;
    }

    td {
      padding: 12px 14px;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: middle;
    }

    tr:hover td { background: #f8fafc; }

    /* Strict Column Widths to Fix Screen Cut Issue */
    .col-id { width: 110px; font-weight: 700; color: #0284c7; }
    .col-name { 
      width: 220px; 
      font-weight: 600; 
      color: #0f172a;
      word-break: break-word; /* Fixes long text overflow */
      line-height: 1.4;
    }
    .col-district { width: 120px; }
    .col-mobile { width: 130px; font-weight: 600; }
    .col-status { width: 160px; }
    .col-payment { width: 120px; }
    .col-date { width: 110px; color: #64748b; font-size: 12.5px; white-space: nowrap; }
    .col-action { width: 90px; text-align: center; }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
    }
    .badge-pending { background: #fef3c7; color: #b45309; }
    .badge-processing { background: #e0f2fe; color: #0369a1; }
    .badge-received { background: #f1f5f9; color: #475569; }
    .badge-cancel { background: #fee2e2; color: #dc2626; }
    .badge-completed { background: #dcfce7; color: #166534; }

    /* Edit Button */
    .btn-edit {
      padding: 5px 10px;
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-edit:hover { background: #2563eb; color: #fff; }

    /* ══════ MODAL POPUP SYSTEM ══════ */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(15,23,42,0.65);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 16px;
      backdrop-filter: blur(2px);
    }
    .modal-box {
      background: #fff;
      width: 100%;
      max-width: 680px;
      border-radius: 14px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.25);
      overflow: hidden;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }
    .modal-head {
      background: #0f172a;
      color: #fff;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-head h3 { font-size: 1.1rem; font-weight: 800; }
    .modal-close {
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 20px;
      cursor: pointer;
      font-weight: 700;
    }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
    }

    /* Modal Form Grid */
    .m-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .m-group { display: flex; flex-direction: column; gap: 4px; }
    .m-group.full { grid-column: 1 / -1; }
    .m-group label {
      font-size: 12.5px;
      font-weight: 700;
      color: #334155;
    }
    .m-group input, .m-group select, .m-group textarea {
      padding: 9px 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13.5px;
      outline: none;
      font-family: inherit;
    }
    .m-group input:focus, .m-group select:focus, .m-group textarea:focus {
      border-color: #2563eb;
    }

    .modal-footer {
      padding: 14px 20px;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
  </style>
</head>
<body>

  <!-- Top Navigation & Controls -->
  <header class="top-bar">
    <div class="brand-title">
      📦 JameenSeva <span>Master Admin Panel</span>
    </div>

    <div class="control-actions">
      <!-- Live Search -->
      <input type="text" id="searchInp" class="search-inp" placeholder="खोजें: नाम, मोबाइल, ऑर्डर ID, ज़िला..." onkeyup="filterOrders()" />

      <!-- Status Filter -->
      <select id="statusFilter" class="filter-select" onchange="filterOrders()">
        <option value="">सभी स्टेटस (All Status)</option>
        <option value="Order Received">Order Received</option>
        <option value="Processing">Processing</option>
        <option value="cancel">Cancelled</option>
        <option value="Delivered">Delivered</option>
      </select>

      <!-- New Manual Order Button -->
      <button class="btn btn-green" onclick="openManualOrderModal()">
        ➕ नया मैन्युअल ऑर्डर दर्ज करें
      </button>

      <!-- Refresh -->
      <button class="btn btn-refresh" onclick="fetchOrders()">
        🔄 रिफ्रेश करें
      </button>
    </div>
  </header>

  <!-- Table Card -->
  <div class="table-card">
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th class="col-id">ऑर्डर ID</th>
            <th class="col-name">रैयत / किसान का नाम</th>
            <th class="col-district">ज़िला</th>
            <th class="col-mobile">मोबाइल</th>
            <th class="col-status">ऑर्डर स्टेटस</th>
            <th class="col-payment">पेमेंट स्टेटस</th>
            <th class="col-date">तारीख</th>
            <th class="col-action">एक्शन</th>
          </tr>
        </thead>
        <tbody id="ordersTbody">
          <tr>
            <td colspan="8" style="text-align:center; padding: 40px; color: #64748b;">
              डेटा लोड हो रहा है, कृपया प्रतीक्षा करें...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- ══════════ ADVANCED EDIT MODAL ══════════ -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="editModalTitle">✏️ ऑर्डर विवरण संपादित करें</h3>
        <button class="modal-close" onclick="closeEditModal()">✕</button>
      </div>

      <div class="modal-body">
        <input type="hidden" id="editRowId" />
        
        <div class="m-grid">
          <div class="m-group">
            <label>ऑर्डर ID (Order ID)</label>
            <input type="text" id="editOrderId" readonly style="background:#f1f5f9; font-weight:700;" />
          </div>

          <div class="m-group">
            <label>तारीख (Order Date)</label>
            <input type="text" id="editOrderDate" />
          </div>

          <div class="m-group full">
            <label>रैयत / किसान का नाम (Full Name)</label>
            <input type="text" id="editRaiyatName" required />
          </div>

          <div class="m-group">
            <label>मोबाइल नंबर (WhatsApp No.)</label>
            <input type="text" id="editMobile" maxlength="10" required />
          </div>

          <div class="m-group">
            <label>ज़िला (District)</label>
            <input type="text" id="editDistrict" required />
          </div>

          <div class="m-group">
            <label>प्रखंड / अंचल (Block)</label>
            <input type="text" id="editBlock" />
          </div>

          <div class="m-group">
            <label>मौजा / गाँव (Mauja)</label>
            <input type="text" id="editVillage" />
          </div>

          <div class="m-group">
            <label>थाना नंबर (Thana No.)</label>
            <input type="text" id="editThana" />
          </div>

          <div class="m-group">
            <label>खाता नंबर (Khata No.)</label>
            <input type="text" id="editKhata" />
          </div>

          <div class="m-group">
            <label>खेसरा नंबर (Khesra No.)</label>
            <input type="text" id="editKhesra" />
          </div>

          <div class="m-group">
            <label>ऑर्डर स्टेटस (Order Status)</label>
            <select id="editStatus">
              <option value="Order Received">Order Received</option>
              <option value="Processing">Processing</option>
              <option value="दोहरा ऑर्डर -cancel ❌">दोहरा ऑर्डर -cancel ❌</option>
              <option value="रिकॉर्ड फटा होने के कारण आर्डर cancel ❌">रिकॉर्ड फटा होने के कारण आर्डर cancel ❌</option>
              <option value="रिकार्ड इस समय उपलब्ध नहीं है आर्डर cancel ❌">रिकार्ड इस समय उपलब्ध नहीं है आर्डर cancel ❌</option>
              <option value="Dispatched / इन ट्रांजिट 🚚">Dispatched / इन ट्रांजिट 🚚</option>
              <option value="Delivered ✅">Delivered ✅</option>
            </select>
          </div>

          <div class="m-group">
            <label>पेमेंट स्टेटस / विवरण (Payment / Remarks)</label>
            <input type="text" id="editPaymentStatus" placeholder="Pending / Paid / CS 116 F1" />
          </div>

          <div class="m-group full">
            <label>ट्रैकिंग नंबर / स्पीड पोस्ट नंबर (Tracking ID)</label>
            <input type="text" id="editTrackingNumber" placeholder="उदा. EK123456789IN" />
          </div>

          <div class="m-group full">
            <label>पूरा पता (Full Address)</label>
            <textarea id="editFullAddress" rows="2"></textarea>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-refresh" onclick="closeEditModal()">रद्द करें</button>
        <button class="btn btn-primary" id="saveEditBtn" onclick="saveOrderChanges()">💾 बदलाव सुरक्षित करें</button>
      </div>
    </div>
  </div>

  <!-- ══════════ MANUAL ORDER ENTRY MODAL ══════════ -->
  <div class="modal-overlay" id="manualOrderModal">
    <div class="modal-box">
      <div class="modal-head" style="background:#16a34a;">
        <h3>➕ नया मैन्युअल ऑर्डर दर्ज करें</h3>
        <button class="modal-close" onclick="closeManualOrderModal()">✕</button>
      </div>

      <div class="modal-body">
        <div class="m-grid">
          <div class="m-group">
            <label>सेवा का प्रकार (Service Type) *</label>
            <select id="mServiceType">
              <option value="Khatiyan">खतियान होम डिलीवरी</option>
              <option value="Panchnama">पंचनामा बटवारा</option>
              <option value="Amin Booking">प्राइवेट अमीन बुकिंग</option>
              <option value="Map">भू-नक्शा शीट</option>
              <option value="Register2">रजिस्टर-2 नकल</option>
            </select>
          </div>

          <div class="m-group">
            <label>ऑर्डर तारीख *</label>
            <input type="text" id="mOrderDate" />
          </div>

          <div class="m-group full">
            <label>रैयत / किसान का नाम *</label>
            <input type="text" id="mRaiyatName" placeholder="किसान का पूरा नाम दर्ज करें" required />
          </div>

          <div class="m-group">
            <label>मोबाइल नंबर (WhatsApp) *</label>
            <input type="text" id="mMobile" maxlength="10" placeholder="10 अंकों का नंबर" required />
          </div>

          <div class="m-group">
            <label>ज़िला (District) *</label>
            <input type="text" id="mDistrict" placeholder="उदा. Darbhanga" required />
          </div>

          <div class="m-group">
            <label>अंचल / प्रखंड (Block) *</label>
            <input type="text" id="mBlock" placeholder="प्रखंड का नाम" required />
          </div>

          <div class="m-group">
            <label>मौजा / गाँव *</label>
            <input type="text" id="mVillage" placeholder="गाँव का नाम" required />
          </div>

          <div class="m-group">
            <label>थाना नंबर (Thana No.)</label>
            <input type="text" id="mThana" placeholder="थाना संख्या" />
          </div>

          <div class="m-group">
            <label>खाता नंबर (Khata No.)</label>
            <input type="text" id="mKhata" placeholder="खाता संख्या" />
          </div>

          <div class="m-group">
            <label>खेसरा नंबर (Khesra No.)</label>
            <input type="text" id="mKhesra" placeholder="खेसरा संख्या" />
          </div>

          <div class="m-group">
            <label>शुरुआती ऑर्डर स्टेटस</label>
            <select id="mStatus">
              <option value="Order Received">Order Received</option>
              <option value="Processing">Processing</option>
            </select>
          </div>

          <div class="m-group">
            <label>पेमेंट स्थिति / विवरण</label>
            <input type="text" id="mPaymentStatus" placeholder="उदा. Pending या COD ₹79" />
          </div>

          <div class="m-group full">
            <label>पूरा डाक पता (Full Delivery Address) *</label>
            <textarea id="mFullAddress" rows="2" placeholder="मकान/वार्ड, गाँव, पोस्ट, पिन कोड" required></textarea>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-refresh" onclick="closeManualOrderModal()">रद्द करें</button>
        <button class="btn btn-green" id="submitManualBtn" onclick="submitManualOrder()">✅ ऑर्डर सुरक्षित करें</button>
      </div>
    </div>
  </div>

  <!-- ══════════ JAVASCRIPT LOGIC ══════════ -->
  <script>
    // Supabase Configuration
    const SB_URL = "https://efgvsddclcnbmwqbtily.supabase.co";
    const SB_KEY = "sb_publishable_9w-thNkNGT410q9-xfqISQ_sH2Uzmv5";
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    // Target Table Name in Supabase
    const ORDERS_TABLE = "orders"; // Agar aapki table ka naam alag hai (jaise 'amin-booking') to yahan badal sakte hain

    let ALL_ORDERS = [];

    // Fetch All Orders on Load
    async function fetchOrders() {
      const tbody = document.getElementById('ordersTbody');
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding: 30px; color: #64748b;">डेटा लोड हो रहा है...</td></tr>`;

      try {
        const { data, error } = await _supabase
          .from(ORDERS_TABLE)
          .select('*')
          .order('id', { ascending: false });

        if (error) throw error;

        ALL_ORDERS = data || [];
        renderTable(ALL_ORDERS);
      } catch (err) {
        console.error(err);
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding: 30px; color: #dc2626;">त्रुटि: ${err.message}</td></tr>`;
      }
    }

    // Render Table Rows with Strict Widths
    function renderTable(orders) {
      const tbody = document.getElementById('ordersTbody');
      if (!orders || orders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding: 40px; color: #64748b;">कोई ऑर्डर उपलब्ध नहीं है।</td></tr>`;
        return;
      }

      tbody.innerHTML = orders.map(ord => {
        const oid = ord.order_id || ord.orderId || ('JS-' + ord.id);
        const name = ord.raiyat_name || ord.name || '—';
        const district = ord.district || ord.jila || '—';
        const mobile = ord.mobile || ord.phone || '—';
        const status = ord.status || 'Order Received';
        const payment = ord.payment_status || ord.payment || 'Pending';
        const date = ord.order_date || ord.created_at || '—';

        // Badge class determination
        let badgeClass = 'badge-received';
        if (status.includes('cancel')) badgeClass = 'badge-cancel';
        else if (status.includes('Processing')) badgeClass = 'badge-processing';
        else if (status.includes('Delivered')) badgeClass = 'badge-completed';
        else if (status.includes('Pending')) badgeClass = 'badge-pending';

        return `
          <tr>
            <td class="col-id">${oid}</td>
            <td class="col-name" title="${escapeHtml(name)}">${escapeHtml(name)}</td>
            <td class="col-district">${escapeHtml(district)}</td>
            <td class="col-mobile"><a href="tel:${mobile}" style="color:#0f172a; text-decoration:none;">${mobile}</a></td>
            <td class="col-status"><span class="badge ${badgeClass}">${escapeHtml(status)}</span></td>
            <td class="col-payment"><span class="badge ${payment === 'Pending' ? 'badge-pending' : 'badge-processing'}">${escapeHtml(payment)}</span></td>
            <td class="col-date">${formatDate(date)}</td>
            <td class="col-action">
              <button class="btn-edit" onclick="openEditModal(${ord.id})">✏️ Edit</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    // Filter Logic for Search & Status
    function filterOrders() {
      const q = document.getElementById('searchInp').value.toLowerCase().trim();
      const statusFilter = document.getElementById('statusFilter').value;

      const filtered = ALL_ORDERS.filter(o => {
        const name = (o.raiyat_name || o.name || '').toLowerCase();
        const mobile = (o.mobile || o.phone || '').toLowerCase();
        const oid = (o.order_id || o.orderId || ('JS-' + o.id)).toLowerCase();
        const dist = (o.district || o.jila || '').toLowerCase();
        const status = (o.status || '');

        const matchesQuery = !q || name.includes(q) || mobile.includes(q) || oid.includes(q) || dist.includes(q);
        const matchesStatus = !statusFilter || status.includes(statusFilter);

        return matchesQuery && matchesStatus;
      });

      renderTable(filtered);
    }

    // Open Edit Modal with Order Data
    function openEditModal(rowId) {
      const ord = ALL_ORDERS.find(o => o.id === rowId);
      if (!ord) return;

      document.getElementById('editRowId').value = ord.id;
      document.getElementById('editOrderId').value = ord.order_id || ord.orderId || ('JS-' + ord.id);
      document.getElementById('editOrderDate').value = ord.order_date || ord.created_at || '';
      document.getElementById('editRaiyatName').value = ord.raiyat_name || ord.name || '';
      document.getElementById('editMobile').value = ord.mobile || ord.phone || '';
      document.getElementById('editDistrict').value = ord.district || ord.jila || '';
      document.getElementById('editBlock').value = ord.block || ord.anchal || '';
      document.getElementById('editVillage').value = ord.village || ord.mauja || '';
      document.getElementById('editThana').value = ord.thana_no || ord.thana || '';
      document.getElementById('editKhata').value = ord.khata_no || ord.khata || '';
      document.getElementById('editKhesra').value = ord.khesra_no || ord.khesra || '';
      document.getElementById('editStatus').value = ord.status || 'Order Received';
      document.getElementById('editPaymentStatus').value = ord.payment_status || ord.payment || 'Pending';
      document.getElementById('editTrackingNumber').value = ord.tracking_number || ord.tracking_id || '';
      document.getElementById('editFullAddress').value = ord.full_address || ord.address || '';

      document.getElementById('editModal').style.display = 'flex';
    }

    function closeEditModal() {
      document.getElementById('editModal').style.display = 'none';
    }

    // Save All Order Edits to Supabase
    async function saveOrderChanges() {
      const rowId = document.getElementById('editRowId').value;
      const saveBtn = document.getElementById('saveEditBtn');

      const updatedPayload = {
        raiyat_name: document.getElementById('editRaiyatName').value.trim(),
        mobile: document.getElementById('editMobile').value.trim(),
        district: document.getElementById('editDistrict').value.trim(),
        block: document.getElementById('editBlock').value.trim(),
        village: document.getElementById('editVillage').value.trim(),
        thana_no: document.getElementById('editThana').value.trim(),
        khata_no: document.getElementById('editKhata').value.trim(),
        khesra_no: document.getElementById('editKhesra').value.trim(),
        status: document.getElementById('editStatus').value,
        payment_status: document.getElementById('editPaymentStatus').value.trim(),
        tracking_number: document.getElementById('editTrackingNumber').value.trim(),
        full_address: document.getElementById('editFullAddress').value.trim(),
        order_date: document.getElementById('editOrderDate').value.trim()
      };

      saveBtn.disabled = true;
      saveBtn.innerText = "सुरक्षित हो रहा है...";

      try {
        const { error } = await _supabase
          .from(ORDERS_TABLE)
          .update(updatedPayload)
          .eq('id', rowId);

        if (error) throw error;

        alert("✅ ऑर्डर विवरण सफलतापूर्वक अपडेट हो गया!");
        closeEditModal();
        fetchOrders();
      } catch (err) {
        console.error(err);
        alert("अपडेट में त्रुटि: " + err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = "💾 बदलाव सुरक्षित करें";
      }
    }

    // Open Manual Order Entry Modal
    function openManualOrderModal() {
      const now = new Date();
      document.getElementById('mOrderDate').value = now.toLocaleDateString('hi-IN', { day:'2-digit', month:'short', year:'numeric' });
      document.getElementById('mRaiyatName').value = '';
      document.getElementById('mMobile').value = '';
      document.getElementById('mDistrict').value = '';
      document.getElementById('mBlock').value = '';
      document.getElementById('mVillage').value = '';
      document.getElementById('mThana').value = '';
      document.getElementById('mKhata').value = '';
      document.getElementById('mKhesra').value = '';
      document.getElementById('mPaymentStatus').value = 'Pending';
      document.getElementById('mFullAddress').value = '';

      document.getElementById('manualOrderModal').style.display = 'flex';
    }

    function closeManualOrderModal() {
      document.getElementById('manualOrderModal').style.display = 'none';
    }

    // Submit Manual Order to Supabase
    async function submitManualOrder() {
      const name = document.getElementById('mRaiyatName').value.trim();
      const mobile = document.getElementById('mMobile').value.trim();
      const district = document.getElementById('mDistrict').value.trim();
      const block = document.getElementById('mBlock').value.trim();
      const village = document.getElementById('mVillage').value.trim();
      const addr = document.getElementById('mFullAddress').value.trim();
      const submitBtn = document.getElementById('submitManualBtn');

      if (!name || mobile.length < 10 || !district || !block || !village || !addr) {
        alert("कृपया सभी अनिवार्य (*) फ़ील्ड और 10 अंकों का मोबाइल नंबर भरें!");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "दर्ज हो रहा है...";

      const newOrderId = "JS-" + Math.floor(100000 + Math.random() * 900000);

      const payload = {
        order_id: newOrderId,
        order_date: document.getElementById('mOrderDate').value,
        raiyat_name: name,
        mobile: mobile,
        district: district,
        block: block,
        village: village,
        thana_no: document.getElementById('mThana').value.trim() || null,
        khata_no: document.getElementById('mKhata').value.trim() || null,
        khesra_no: document.getElementById('mKhesra').value.trim() || null,
        status: document.getElementById('mStatus').value,
        payment_status: document.getElementById('mPaymentStatus').value.trim() || 'Pending',
        full_address: addr
      };

      try {
        const { error } = await _supabase
          .from(ORDERS_TABLE)
          .insert([payload]);

        if (error) throw error;

        alert("✅ नया ऑर्डर सफलतापूर्वक दर्ज हुआ!\nOrder ID: " + newOrderId);
        closeManualOrderModal();
        fetchOrders();
      } catch (err) {
        console.error(err);
        alert("ऑर्डर दर्ज करने में त्रुटि: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "✅ ऑर्डर सुरक्षित करें";
      }
    }

    // Helpers
    function formatDate(raw) {
      if (!raw) return '—';
      if (raw.length > 15) return raw.substring(0, 15);
      return raw;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Initial Load
    document.addEventListener('DOMContentLoaded', fetchOrders);
  </script>
</body>
</html>
