<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#12314f;
    --navy-light:#1c4a75;
    --gold:#c9922f;
    --gold-light:#e8b95c;
    --bg:#f2f4f7;
    --card:#ffffff;
    --border:#e2e6ec;
    --text:#1e2733;
    --text-mute:#6b7684;
    --green:#1f8a52;
    --green-bg:#e7f6ee;
    --amber:#b3760a;
    --amber-bg:#fdf1dc;
    --red:#c0392b;
    --red-bg:#fbe8e5;
    --blue:#1c5d9e;
    --blue-bg:#e7f0fa;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Inter','Noto Sans Devanagari',sans-serif;
    margin:0;
    background:var(--bg);
    color:var(--text);
    display:none;
  }
  .lang-dev{font-family:'Noto Sans Devanagari','Inter',sans-serif;}

  /* ---- Navbar ---- */
  .navbar{
    background:linear-gradient(135deg,var(--navy) 0%, var(--navy-light) 100%);
    color:#fff;
    padding:12px 28px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
    position:sticky; top:0; z-index:50;
    flex-wrap:wrap; gap:10px;
  }
  .navbar .brand{display:flex; align-items:center; gap:10px;}
  .navbar .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--gold-light);}
  .navbar h1{margin:0; font-size:18px; font-weight:700; letter-spacing:.2px;}
  .navbar .sub{font-size:11px; color:#c7d4e2; margin-top:2px;}
  
  .admin-profile-badge{
    display:flex; align-items:center; gap:10px;
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2);
    padding:5px 14px; border-radius:50px;
  }
  .admin-avatar{
    width:32px; height:32px; border-radius:50%;
    background:#22c55e; color:#0f172a;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:13px; border:2px solid #fff;
  }
  .admin-info{line-height:1.2; text-align:left;}
  .admin-name{font-size:13px; font-weight:700; color:#ffffff;}
  .admin-role{font-size:10.5px; color:#c7d4e2;}

  .btn-logout{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.25);
    color:#fff; padding:8px 16px; border-radius:6px;
    cursor:pointer; font-weight:600; font-size:13px;
    transition:.15s;
  }
  .btn-logout:hover{background:var(--red); border-color:var(--red);}

  .container{padding:22px 28px 60px; max-width:1440px; margin:0 auto;}

  /* ---- Tabs ---- */
  .tabs-container{display:flex; gap:8px; margin-bottom:18px; overflow-x:auto; padding-bottom:6px;}
  .tab-btn{
    padding:10px 18px; background:#fff; border:1px solid var(--border);
    border-radius:8px; cursor:pointer; font-weight:600; color:var(--text-mute);
    white-space:nowrap; font-size:13.5px; transition:.15s;
  }
  .tab-btn:hover{border-color:var(--navy-light); color:var(--navy);}
  .tab-btn.active{background:var(--navy); color:#fff; border-color:var(--navy);}

  /* ---- Summary chips ---- */
  .summary-row{display:flex; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
  .chip{
    background:#fff; border:1px solid var(--border); border-radius:10px;
    padding:12px 18px; min-width:120px;
  }
  .chip .num{font-size:22px; font-weight:700; color:var(--navy);}
  .chip .label{font-size:12px; color:var(--text-mute); margin-top:2px;}
  .chip.total .num{color:var(--navy);}
  .chip.pending .num{color:var(--amber);}
  .chip.done .num{color:var(--green);}
  .chip.rejected .num{color:var(--red);}

  /* ---- Toolbar ---- */
  .toolbar{
    display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center;
  }
  .toolbar input[type=text], .toolbar select{
    padding:10px 12px; border:1px solid var(--border); border-radius:7px;
    font-size:13.5px; background:#fff;
  }
  .toolbar input[type=text]{flex:1; min-width:220px;}
  .btn-outline{
    padding:10px 16px; border-radius:7px; border:1px solid var(--navy);
    background:#fff; color:var(--navy); font-weight:600; cursor:pointer; font-size:13.5px;
  }
  .btn-outline:hover{background:var(--navy); color:#fff;}
  .btn-refresh{margin-left:auto;}

  /* ---- Add panel ---- */
  .add-panel{
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    padding:0; margin-bottom:18px; overflow:hidden;
  }
  .add-panel summary{
    cursor:pointer; padding:14px 18px; font-weight:700; color:var(--navy);
    list-style:none; display:flex; justify-content:space-between; align-items:center;
    background:#f8f9fb;
  }
  .add-panel summary::-webkit-details-marker{display:none;}
  .add-panel .add-body{padding:18px;}
  .form-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:14px;}
  .form-group label{display:block; margin-bottom:5px; font-weight:600; font-size:12.5px; color:var(--text-mute);}
  .form-group input, .form-group select, .form-group textarea{
    width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:6px; font-size:13.5px; outline:none; font-family:inherit;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus{border-color:var(--blue);}
  .btn-submit{
    background:var(--navy); color:#fff; border:none; padding:11px 22px; border-radius:7px;
    cursor:pointer; font-weight:700; font-size:13.5px; margin-top:14px;
  }
  .btn-submit:hover{background:var(--navy-light);}
  #formMessage{margin-top:10px; font-weight:600; font-size:13px;}

  /* ---- Table Layout ---- */
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    padding:0; overflow:hidden;
  }
  .table-container{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:13px; table-layout:fixed;}
  th, td{padding:11px 12px; text-align:left; border-bottom:1px solid var(--border); vertical-align:middle;}
  th{background:#f8f9fb; color:var(--text-mute); font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; font-weight:700; white-space:nowrap;}
  tbody tr{cursor:pointer; transition:.1s;}
  tbody tr:hover{background:#f5f8fc;}

  /* Strict width & break rules to fix date cut off */
  .col-break{word-break:break-word; line-height:1.35;}

  .badge{
    display:inline-block; padding:4px 9px; border-radius:20px; font-size:11.5px; font-weight:700; white-space:nowrap;
  }
  .btn-edit-action{
    background:#eff6ff; color:#2563eb; border:1px solid #bfdbfe;
    padding:5px 10px; border-radius:6px; font-size:12px; font-weight:700; cursor:pointer; transition:.15s;
  }
  .btn-edit-action:hover{background:#2563eb; color:#fff;}

  #loadingText{font-weight:600; color:var(--text-mute); padding:22px;}
  .empty-state{padding:40px; text-align:center; color:var(--text-mute);}

  /* ---- Modals ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(15,25,40,0.65);
    display:none; align-items:center; justify-content:center; z-index:100; padding:16px;
    backdrop-filter:blur(2px);
  }
  .overlay.open{display:flex;}
  .modal{
    background:#fff; border-radius:12px; width:100%; max-width:680px; max-height:90vh;
    overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.3);
  }
  .modal-head{
    padding:16px 20px; border-bottom:1px solid var(--border); display:flex;
    justify-content:space-between; align-items:center; position:sticky; top:0; background:#fff; z-index:10;
  }
  .modal-head h3{margin:0; font-size:16px; color:var(--navy);}
  .modal-close{cursor:pointer; border:none; background:none; font-size:22px; color:var(--text-mute); line-height:1;}
  .modal-body{padding:20px;}
  
  .detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; background:#f8f9fb; padding:14px; border-radius:8px; border:1px solid var(--border);}
  .detail-item .k{font-size:11px; color:var(--text-mute); font-weight:700; text-transform:uppercase;}
  .detail-item .v{font-size:13.5px; margin-top:3px; word-break:break-word; font-weight:600;}
  .detail-item .v a{color:var(--blue);}

  .edit-row{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:12px; margin-top:14px;}
  .modal-actions{display:flex; gap:10px; margin-top:20px;}
  .btn-save{flex:1; background:var(--green); color:#fff; border:none; padding:11px; border-radius:7px; font-weight:700; cursor:pointer;}
  .btn-save:disabled{opacity:.6; cursor:not-allowed;}
  .btn-delete{background:var(--red-bg); color:var(--red); border:1px solid var(--red); padding:11px 18px; border-radius:7px; font-weight:700; cursor:pointer;}
  .modal-msg{margin-top:10px; font-weight:600; font-size:13px;}
  .modal-msg.box{padding:10px 12px; border-radius:7px;}
  .modal-msg.msg-info{background:var(--blue-bg); color:var(--blue);}
  .modal-msg.msg-success{background:var(--green-bg); color:var(--green);}
  .modal-msg.msg-error{background:var(--red-bg); color:var(--red);}

  .quick-chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
  .quick-chip{
    padding:4px 10px; border-radius:16px; border:1px solid var(--border); background:#fff;
    font-size:11.5px; font-weight:600; cursor:pointer; color:var(--text); transition:.12s;
  }
  .quick-chip:hover{border-color:var(--navy); color:var(--navy); background:var(--blue-bg);}
  .custom-status-input{margin-top:6px; display:none;}
  .custom-status-input.show{display:block;}

  @media (max-width:640px){
    .detail-grid{grid-template-columns:1fr;}
    .navbar{padding:12px 16px;}
    .container{padding:14px;}
  }
</style>
</head>

function getStatusStyle(val) {
  const s = (val || '').toLowerCase();
  if (s.includes('cancel') || s.includes('reject') || s.includes('failed')) return { bg: '#fee2e2', text: '#dc2626' };
  if (s.includes('process') || s.includes('तैयार') || s.includes('इंतजार') || s.includes('search')) return { bg: '#fef3c7', text: '#d97706' };
  if (s.includes('dispatch') || s.includes('transit')) return { bg: '#dbeafe', text: '#2563eb' };
  if (s.includes('deliver') || s.includes('paid') || s.includes('complet') || s.includes('approve') || s.includes('confirm')) return { bg: '#dcfce7', text: '#15803d' };
  if (s.includes('pending')) return { bg: '#fef3c7', text: '#b45309' };

let currentKey = 'panchnama';
let currentRows = [];
let selectedRow = null;

// ---------------- Security ----------------
async function checkSecurity() {
  const { data: { user } } = await supabase.auth.getUser()
  if (!user || user.id !== ADMIN_UUID) {
    alert('अनाधिकृत प्रवेश!')
    window.location.href = 'admin-login.html'
  } else {
    document.body.style.display = 'block'
    buildTabs();
    loadTableContent();
  }
}

// ---------------- Tabs ----------------
function buildTabs(){
  const container = document.getElementById('tabsContainer');
  container.innerHTML = '';
  Object.keys(TABLES).forEach(key => {
    const cfg = TABLES[key];
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (key === currentKey ? ' active' : '');
    btn.textContent = `${cfg.icon} ${cfg.label}`;
    btn.onclick = () => switchTable(key);
    btn.dataset.key = key;
    container.appendChild(btn);
  });
}

function switchTable(key){
  currentKey = key;
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.key === key);
  });
  document.getElementById('searchInput').value = '';
  document.getElementById('formMessage').innerText = '';
  buildAddForm();
  loadTableContent();
}

// ---------------- Add form ----------------
function buildAddForm(){
  const cfg = TABLES[currentKey];
  const inputsDiv = document.getElementById('dynamicInputs');
  inputsDiv.innerHTML = '';
  cfg.addFields.forEach(f => {
    const wrap = document.createElement('div');
    wrap.className = 'form-group';
    wrap.innerHTML = `
      <label class="lang-dev">${f.label}</label>
      <input type="${f.type || 'text'}" id="add_${f.key}">
    `;
    inputsDiv.appendChild(wrap);
  });
}

document.getElementById('dynamicForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const cfg = TABLES[currentKey];
  const msg = document.getElementById('formMessage');
  msg.style.color = '#1c5d9e';
  msg.innerText = 'सेव किया जा रहा है...';

  const insertData = {};
  cfg.addFields.forEach(f => {
    const el = document.getElementById(`add_${f.key}`);
    if (!el) return;
    let val = el.value;
    if (f.type === 'number') val = val ? Number(val) : null;
    insertData[f.key] = val || null;
  });

  const { error } = await supabase.from(cfg.table).insert([insertData]);
  if (error) {
    msg.style.color = '#c0392b';
    msg.innerText = 'एरर: ' + error.message;
  } else {
    msg.style.color = '#1f8a52';
    msg.innerText = 'बधाई हो! रिकॉर्ड सेव हो गया। 🎉';
    document.getElementById('dynamicForm').reset();
    loadTableContent();
  }
});

// ---------------- Load & Render Table ----------------
async function loadTableContent(){
  const cfg = TABLES[currentKey];
  document.getElementById('loadingText').style.display = 'block';
  document.getElementById('loadingText').innerText = 'डेटा लोड हो रहा है...';
  document.getElementById('dataTable').style.display = 'none';
  document.getElementById('emptyState').style.display = 'none';

  const { data, error } = await supabase.from(cfg.table).select('*').order('created_at', { ascending:false });

  if (error) {
    document.getElementById('loadingText').innerText = 'डेटा लोड एरर: ' + error.message;
    return;
  }

  currentRows = data || [];
  renderSummary();
  populateStatusFilter();
  renderTable();
  document.getElementById('loadingText').style.display = 'none';
}

function renderSummary(){
  const total = currentRows.length;
  const pending = currentRows.filter(r => (r.status || r.order_status || '').toLowerCase().includes('pending')).length;
  const done = currentRows.filter(r => ['completed','approved','confirmed','delivered'].some(k => (r.status || r.order_status || '').toLowerCase().includes(k))).length;
  const rejected = currentRows.filter(r => ['rejected','cancel'].some(k => (r.status || r.order_status || '').toLowerCase().includes(k))).length;

  document.getElementById('summaryRow').innerHTML = `
    <div class="chip total"><div class="num">${total}</div><div class="label lang-dev">कुल रिकॉर्ड</div></div>
    <div class="chip pending"><div class="num">${pending}</div><div class="label lang-dev">पेंडिंग</div></div>
    <div class="chip done"><div class="num">${done}</div><div class="label lang-dev">पूर्ण / स्वीकृत</div></div>
    <div class="chip rejected"><div class="num">${rejected}</div><div class="label lang-dev">कैंसिल / रिजेक्ट</div></div>
  `;
}

function populateStatusFilter(){
  const sel = document.getElementById('statusFilter');
  const cfg = TABLES[currentKey];
  const statusField = cfg.quickEditable.find(f => f.key === 'status' || f.key === 'order_status');
  sel.innerHTML = '<option value="">सभी स्टेटस</option>';
  if (statusField && statusField.options) {
    statusField.options.forEach(opt => {
      const o = document.createElement('option');
      o.value = opt; o.textContent = opt;
      sel.appendChild(o);
    });
  }
}

function fmtDate(val){
  if (!val) return '';
  try { return new Date(val).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' }); }
  catch { return val; }
}

function getFilteredRows(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const statusF = document.getElementById('statusFilter').value;
  return currentRows.filter(row => {
    const rowStatus = row.status || row.order_status || '';
    const matchesStatus = !statusF || rowStatus === statusF;
    if (!matchesStatus) return false;
    if (!q) return true;
    const haystack = [row.order_id, row.raiyat_name, row.customer_name, row.name, row.mobile, row.customer_mobile, row.district, row.mauja, row.village, row.reg_no]
      .filter(Boolean).join(' ').toLowerCase();
    return haystack.includes(q);
  });
}

function renderTable(){
  const cfg = TABLES[currentKey];
  const thead = document.getElementById('tableHead');
  const tbody = document.getElementById('tableBody');
  const rows = getFilteredRows();

  thead.innerHTML = '<tr>' + cfg.listCols.map(c => `<th style="${c.width ? `width:${c.width};` : ''}" class="lang-dev">${c.label}</th>`).join('') + '</tr>';
  tbody.innerHTML = '';

  if (rows.length === 0) {
    document.getElementById('dataTable').style.display = 'none';
    document.getElementById('emptyState').style.display = 'block';
    return;
  }
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('dataTable').style.display = 'table';

  rows.forEach(row => {
    const tr = document.createElement('tr');
    tr.innerHTML = cfg.listCols.map(c => {
      if (c.action) {
        return `<td style="text-align:center;"><button class="btn-edit-action" onclick="event.stopPropagation(); window.openFullEditById(${row[cfg.idKey]})">✏️ Edit</button></td>`;
      }
      let val = row[c.key];
      if (c.date) val = fmtDate(val);
      if (c.badge) {
        const style = getStatusStyle(val);
        return `<td><span class="badge" style="background:${style.bg}; color:${style.text};">${val || 'N/A'}</span></td>`;
      }
      return `<td class="${c.isName ? 'col-break' : ''}">${val ?? '—'}</td>`;
    }).join('');
    
    // Row click -> Quick Status/Payment Modal
    tr.addEventListener('click', () => openQuickStatus(row));
    tbody.appendChild(tr);
  });
}

document.getElementById('searchInput').addEventListener('input', renderTable);
document.getElementById('statusFilter').addEventListener('change', renderTable);
document.getElementById('refreshBtn').addEventListener('click', loadTableContent);

/* ══ 1. QUICK VIEW / STATUS & PAYMENT MODAL ══ */
function openQuickStatus(row){
  const cfg = TABLES[currentKey];
  selectedRow = row;
  document.getElementById('quickModalTitle').innerText = `${cfg.label} — ${row.order_id || row.reg_no || row[cfg.idKey]}`;

  const detailGrid = document.getElementById('quickDetailGrid');
  detailGrid.innerHTML = `
    <div class="detail-item"><div class="k">ऑर्डर ID / REG</div><div class="v">${row.order_id || row.reg_no || row[cfg.idKey]}</div></div>
    <div class="detail-item"><div class="k">नाम</div><div class="v">${row.raiyat_name || row.customer_name || row.name || '—'}</div></div>
    <div class="detail-item"><div class="k">ज़िला / अंचल</div><div class="v">${row.district || '—'} / ${row.block || row.anchal_circle || '—'}</div></div>
    <div class="detail-item"><div class="k">मोबाइल</div><div class="v">${row.mobile || row.customer_mobile || '—'}</div></div>
  `;

  const editDiv = document.getElementById('quickEditFields');
  editDiv.innerHTML = cfg.quickEditable.map(f => {
    const currentVal = row[f.key] || '';
    if (f.type === 'select') {
      const isKnown = f.options.includes(currentVal);
      const options = f.options.map(o => `<option value="${o}" ${currentVal===o?'selected':''}>${o}</option>`).join('');
      const customOptionHtml = f.custom ? `<option value="__custom__" ${(!isKnown && currentVal) ? 'selected' : ''}>✏️ Custom / अन्य लिखें</option>` : '';
      const chipsHtml = (f.quick && f.quick.length) ? `<div class="quick-chips">${f.quick.map(q => `<button type="button" class="quick-chip" data-target="quick_${f.key}" data-value="${q}">${q}</button>`).join('')}</div>` : '';
      const customInputHtml = f.custom ? `<input type="text" id="quick_${f.key}_custom" class="custom-status-input lang-dev ${(!isKnown && currentVal) ? 'show' : ''}" placeholder="कस्टम ${f.label} लिखें..." value="${(!isKnown && currentVal) ? currentVal : ''}">` : '';

      return `
        <div class="form-group" style="margin-bottom:12px;">
          <label class="lang-dev" style="font-weight:700;">${f.label}</label>
          <select id="quick_${f.key}" class="lang-dev">${options}${customOptionHtml}</select>
          ${customInputHtml}
          ${chipsHtml}
        </div>
      `;
    } else {
      return `
        <div class="form-group" style="margin-bottom:12px;">
          <label class="lang-dev" style="font-weight:700;">${f.label}</label>
          <input type="text" id="quick_${f.key}" value="${currentVal}" placeholder="उदा. टोकन प्राप्त, फ़ाइल भेजी आदि">
        </div>
      `;
    }
  }).join('');

  cfg.quickEditable.forEach(f => {
    if (!f.custom) return;
    const sel = document.getElementById(`quick_${f.key}`);
    const customInput = document.getElementById(`quick_${f.key}_custom`);
    if(sel && customInput){
      sel.addEventListener('change', () => {
        customInput.classList.toggle('show', sel.value === '__custom__');
        if (sel.value === '__custom__') customInput.focus();
      });
    }
  });

  editDiv.querySelectorAll('.quick-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const targetSel = document.getElementById(chip.dataset.target);
      if (targetSel) {
        targetSel.value = chip.dataset.value;
        targetSel.dispatchEvent(new Event('change'));
      }
    });
  });

  document.getElementById('quickModalMsg').className = 'modal-msg';
  document.getElementById('quickModalMsg').innerText = '';
  document.getElementById('quickOverlay').classList.add('open');
}

document.getElementById('quickSaveBtn').addEventListener('click', async () => {
  const cfg = TABLES[currentKey];
  const msg = document.getElementById('quickModalMsg');
  const saveBtn = document.getElementById('quickSaveBtn');

  const updateData = {};
  for (const f of cfg.quickEditable) {
    const el = document.getElementById(`quick_${f.key}`);
    if (!el) continue;
    let val = el.value;
    if (val === '__custom__') {
      const customEl = document.getElementById(`quick_${f.key}_custom`);
      val = (customEl ? customEl.value : '').trim();
      if (!val) {
        msg.className = 'modal-msg box msg-error';
        msg.innerText = `कृपया "${f.label}" के लिए कस्टम मान लिखें।`;
        return;
      }
    }
    updateData[f.key] = val;
  }

  saveBtn.disabled = true;
  msg.className = 'modal-msg box msg-info';
  msg.innerText = 'अपडेट किया जा रहा है...';

  const { error } = await supabase.from(cfg.table).update(updateData).eq(cfg.idKey, selectedRow[cfg.idKey]);
  saveBtn.disabled = false;

  if (error) {
    msg.className = 'modal-msg box msg-error';
    msg.innerText = 'एरर: ' + error.message;
    return;
  }

  msg.className = 'modal-msg box msg-success';
  msg.innerText = 'सफलतापूर्वक सुरक्षित हो गया ✅';
  Object.assign(selectedRow, updateData);
  setTimeout(() => closeOverlay('quickOverlay'), 800);
  await loadTableContent();
});

/* ══ 2. MASTER FULL EDIT MODAL (ACTION BUTTON) ══ */
window.openFullEditById = function(id) {
  const cfg = TABLES[currentKey];
  const row = currentRows.find(r => r[cfg.idKey] === id);
  if (!row) return;
  selectedRow = row;

  document.getElementById('fullModalTitle').innerText = `✏️ एडिट: ${cfg.label} — ${row.order_id || row.reg_no || row[cfg.idKey]}`;
  const grid = document.getElementById('fullEditGrid');

  grid.innerHTML = cfg.fields.map(f => {
    let val = row[f.key] ?? '';
    return `
      <div class="form-group">
        <label class="lang-dev">${f.label}</label>
        <input type="text" id="full_${f.key}" value="${escapeHtml(String(val))}">
      </div>
    `;
  }).join('');

  document.getElementById('fullModalMsg').className = 'modal-msg';
  document.getElementById('fullModalMsg').innerText = '';
  document.getElementById('fullEditOverlay').classList.add('open');
};

document.getElementById('fullEditForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const cfg = TABLES[currentKey];
  const msg = document.getElementById('fullModalMsg');
  const saveBtn = document.getElementById('fullSaveBtn');

  const updateData = {};
  cfg.fields.forEach(f => {
    const el = document.getElementById(`full_${f.key}`);
    if (el) updateData[f.key] = el.value || null;
  });

  saveBtn.disabled = true;
  msg.className = 'modal-msg box msg-info';
  msg.innerText = 'डेटाबेस में सेव हो रहा है...';

  const { error } = await supabase.from(cfg.table).update(updateData).eq(cfg.idKey, selectedRow[cfg.idKey]);
  saveBtn.disabled = false;

  if (error) {
    msg.className = 'modal-msg box msg-error';
    msg.innerText = 'एरर: ' + error.message;
    return;
  }

  msg.className = 'modal-msg box msg-success';
  msg.innerText = 'पूरा रिकॉर्ड अपडेट हो गया ✅';
  Object.assign(selectedRow, updateData);
  setTimeout(() => closeOverlay('fullEditOverlay'), 900);
  await loadTableContent();
});

document.getElementById('fullDeleteBtn').addEventListener('click', async () => {
  const cfg = TABLES[currentKey];
  if (!confirm('क्या आप वाकई इस पूरे रिकॉर्ड को डिलीट करना चाहते हैं?')) return;
  const { error } = await supabase.from(cfg.table).delete().eq(cfg.idKey, selectedRow[cfg.idKey]);
  if (error) {
    alert('डिलीट एरर: ' + error.message);
  } else {
    closeOverlay('fullEditOverlay');
    loadTableContent();
  }
});

window.closeOverlay = function(id) {
  document.getElementById(id).classList.remove('open');
};

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* ══ INIT & AUTH ══ */
buildAddForm();
checkSecurity();

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await supabase.auth.signOut();
  window.location.href = 'admin-login.html';
});
</script>
